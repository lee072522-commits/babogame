<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바보타임 — 운영진 패널</title>
<script src="cards.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap');
:root {
  --wood-dark:#3D2610;--wood-mid:#6B4728;--wood-light:#A0714F;
  --gold:#C9922A;--gold-light:#E8B84B;--cream:#F5EDD8;
  --red:#C0392B;--text-dark:#1A0F00;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#0f0800;color:var(--cream);min-height:100vh;}

.op-header{
  background:#1A0F00;border-bottom:2px solid var(--wood-mid);
  padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;
}
.op-header-title{font-family:'Noto Serif KR',serif;font-size:1.1rem;color:var(--gold-light);}
.header-right{display:flex;gap:.6rem;align-items:center;}
.live-badge{
  background:rgba(201,146,42,.15);border:1px solid var(--gold);border-radius:8px;
  padding:.3rem .8rem;font-size:.72rem;color:var(--gold);font-weight:700;letter-spacing:.04em;
  transition:all .3s;
}
.live-badge.on{background:rgba(192,57,43,.2);border-color:#E74C3C;color:#E74C3C;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

.btn-open-bc{
  background:var(--gold);color:#1A0F00;border:none;border-radius:8px;
  padding:.4rem .9rem;font-size:.78rem;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;
}
.btn-open-bc:hover{background:var(--gold-light);}

.btn-reset {
  background: rgba(192, 57, 43, 0.12);
  border: 1.5px solid var(--red);
  color: #E74C3C;
  border-radius: 8px;
  padding: .4rem .9rem;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all .15s;
  white-space: nowrap;
}
.btn-reset:hover {
  background: var(--red);
  color: #fff;
}

.op-body{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 60px);}

/* ── 왼쪽 사이드바 ── */
.op-left{background:#140900;border-right:2px solid var(--wood-dark);padding:1.2rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto;max-height:calc(100vh - 60px);}
.section-title{font-size:.68rem;font-weight:700;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;}

.panel-box{background:#1A0F00;border:1.5px solid var(--wood-dark);border-radius:12px;padding:1rem;}

/* 라운드 */
.round-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.round-num{font-family:'Noto Serif KR',serif;font-size:1.2rem;color:var(--gold-light);}
.btn-round{
  background:rgba(255,255,255,.05);border:1px solid var(--wood-mid);border-radius:6px;
  color:var(--cream);font-family:'Noto Sans KR',sans-serif;font-size:.75rem;
  padding:.3rem .65rem;cursor:pointer;transition:all .15s;
}
.btn-round:hover{border-color:var(--gold);color:var(--gold-light);}
.active-rules-mini{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem;}
.rule-mini-chip{background:rgba(201,146,42,.12);border:1px solid rgba(201,146,42,.4);border-radius:6px;padding:.18rem .45rem;font-size:.65rem;color:var(--gold-light);display:flex;align-items:center;gap:3px;}
.btn-rule-del {background:none;border:none;color:#E74C3C;cursor:pointer;font-weight:bold;margin-left:2px;font-size:0.6rem;}

/* 팀 순서 설정 */
.team-order-list{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.6rem;}
.team-order-item{
  display:flex;align-items:center;justify-content:space-between;
  background:#110700;border:1px solid var(--wood-dark);border-radius:6px;
  padding:0.35rem 0.6rem;font-size:0.75rem;
}
.team-order-name{font-weight:700;color:var(--cream);}
.team-order-ctrls{display:flex;gap:0.25rem;}
.btn-order-move{
  background:transparent;border:none;color:var(--gold);cursor:pointer;
  font-size:0.75rem;padding:0.1rem 0.3rem;font-weight:bold;
}
.btn-order-move:hover{color:var(--gold-light);}
.btn-shuffle{
  padding:0.45rem;background:transparent;border:1.5px dashed var(--gold);
  color:var(--gold-light);border-radius:8px;font-size:0.72rem;font-weight:700;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;
}
.btn-shuffle:hover{background:rgba(201,146,42,0.1);}

/* 검색창 */
.code-row{display:flex;gap:.5rem;}
.code-input{
  flex:1;background:#0f0800;border:2px solid var(--wood-mid);border-radius:8px;
  color:var(--gold-light);font-family:'Noto Sans KR',sans-serif;
  font-size:0.92rem;font-weight:500;padding:.55rem .9rem;outline:none;
  transition:border-color .15s;
}
.code-input:focus{border-color:var(--gold);}
.code-input::placeholder{color:rgba(160,113,79,.35);font-size:.82rem;letter-spacing:.02em;}
.code-hint{font-size:.68rem;color:var(--wood-light);margin-top:.4rem;}

/* 미리보기 */
.preview-wrap{display:flex;flex-direction:column;align-items:center;padding:.4rem 0;gap:.6rem;min-height:160px;justify-content:center;}
.preview-empty{text-align:center;color:rgba(160,113,79,.35);font-size:.82rem;line-height:1.8;}
.preview-card{
  width:130px;background:var(--cream);border:2px solid var(--gold);
  border-radius:12px;padding:0.9rem 0.6rem 0.8rem;text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.5);position:relative;
}
.pc-code{position:absolute;bottom:5px;right:7px;font-size:.5rem;color:rgba(90,60,20,.45);font-weight:700;}
.pc-emoji{font-size:2rem;display:block;margin-bottom:.3rem;}
.pc-badge{display:inline-block;font-size:.5rem;font-weight:700;border-radius:4px;padding:.1rem .4rem;margin-bottom:.2rem;}
.pc-name{font-family:'Noto Serif KR',serif;font-size:.78rem;font-weight:700;color:#1A0F00;margin-bottom:.2rem;}
.pc-desc{font-size:.58rem;color:#5C3D1E;line-height:1.3;}

/* 송출 지정 슬롯 */
.slot-list{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.4rem;}
.slot-row{display:flex;gap:0.4rem;align-items:center;}
.slot-team-name{width:60px;font-size:0.75rem;font-weight:700;color:var(--gold-light);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slot-btn-group{display:flex;gap:0.3rem;flex:1;}
.slot-container{display:flex;flex:1;gap:2px;}
.btn-slot-target{
  flex:1;padding:0.45rem 0.5rem;font-size:0.68rem;border-radius:6px;
  border:1.5px solid var(--wood-dark);background:#110700;color:rgba(255,255,255,0.4);
  cursor:pointer;transition:all 0.15s;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;justify-content:space-between;
}
.btn-slot-target:hover{border-color:var(--gold);color:var(--cream);}
.btn-slot-target.active{
  background:rgba(201,146,42,0.15);border-color:var(--gold);color:var(--gold-light);
  font-weight:bold;
}
.btn-slot-clear{
  background:rgba(192, 57, 43, 0.15);border:1px solid var(--red);color:#E74C3C;
  border-radius:6px;width:24px;height:24px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:0.6rem;flex-shrink:0;
  transition:all 0.15s;
}
.btn-slot-clear:hover{background:var(--red);color:#fff;}

.btn-slot-common{
  width:100%;padding:0.6rem;font-size:0.78rem;border-radius:8px;
  border:1.5px solid var(--gold);background:#1A0F00;color:rgba(255,255,255,0.4);
  cursor:pointer;transition:all 0.15s;text-align:center;font-weight:bold;
}
.btn-slot-common:hover{background:rgba(201,146,42,0.08);color:var(--cream);}
.btn-slot-common.active{
  background:rgba(201,146,42,0.22);color:var(--gold-light);border-color:var(--gold-light);box-shadow:0 0 10px rgba(201,146,42,0.2);
}

/* ── 오른쪽: 카드 목록 ── */
.op-right{padding:1.2rem;overflow-y:auto;max-height:100vh;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem;}
.group-header{
  grid-column:1/-1;font-size:.65rem;font-weight:700;border-radius:6px;
  padding:.28rem .65rem;margin-top:.5rem;letter-spacing:.06em;
}

/* 카드 썸네일 및 사용됨 스타일 */
.card-thumb{
  background:#1A0F00;border:1.5px solid var(--wood-dark);border-radius:10px;
  padding:.7rem .5rem;text-align:center;cursor:pointer;user-select:none;transition:all .2s;
  position: relative;
}
.card-thumb:hover{border-color:var(--gold);background:#251508;}
.card-thumb.selected{border-color:var(--gold);background:rgba(201,146,42,.15);}

/* 배치됨(사용됨) 마크 */
.card-thumb.used {
  opacity: 0.35;
  filter: grayscale(70%) blur(0.4px);
}
.card-thumb.used::after {
  content: '사용됨';
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--red);
  color: #fff;
  font-size: 0.52rem;
  font-weight: bold;
  padding: 0.08rem 0.25rem;
  border-radius: 4px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

.ct-emoji{font-size:1.5rem;margin-bottom:.25rem;}
.ct-name{font-size:.68rem;color:var(--cream);font-weight:700;margin-bottom:.2rem;line-height:1.2;}
.ct-code{font-size:.58rem;color:var(--wood-light);font-weight:700;letter-spacing:.07em;background:rgba(0,0,0,.3);border-radius:4px;padding:.08rem .3rem;display:inline-block;}
.ct-type{font-size:.55rem;border-radius:4px;padding:.08rem .3rem;display:inline-block;margin-top:.18rem;font-weight:700;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--wood-dark);border-radius:2px;}
</style>
</head>
<body>

<div class="op-header">
  <div class="op-header-title">🎛️ 바보타임 — 운영진 패널</div>
  <div class="header-right">
    <button class="btn-reset" onclick="resetGame()">🔄 게임 초기화</button>
    <div class="live-badge" id="live-badge">⚫ 대기 중</div>
    <button class="btn-open-bc" onclick="openBroadcast()">📺 송출 화면 열기</button>
  </div>
</div>

<div class="op-body">
  <div class="op-left">

    <!-- 라운드 설정 -->
    <div class="panel-box">
      <div class="section-title">라운드 설정</div>
      <div class="round-row">
        <div class="round-num">라운드 <span id="round-num">1</span></div>
        <div style="display:flex;gap:.35rem;">
          <button class="btn-round" onclick="changeRound(-1)">◀</button>
          <button class="btn-round" onclick="changeRound(1)">▶</button>
        </div>
      </div>
      <div style="font-size:.67rem;color:var(--wood-light);margin-bottom:.35rem;font-weight:bold;margin-top:0.6rem;">적용 중인 공통 규칙</div>
      <div class="active-rules-mini" id="op-active-rules">
        <span style="color:rgba(160,113,79,.35);font-size:.67rem;">없음</span>
      </div>
    </div>

    <!-- 팀 게임 순서 설정 -->
    <div class="panel-box">
      <div class="section-title">게임 순서 설정 (이름 더블클릭/수정)</div>
      <div class="team-order-list" id="team-order-list"></div>
      <div style="display:flex; gap:0.4rem; margin-top:0.35rem;">
        <button class="btn-shuffle" onclick="nextTurn()" style="flex:1.2; margin-top:0; border-style:solid; background:rgba(201,146,42,0.12);">
          ➔ 다음 차례 넘기기
        </button>
        <button class="btn-shuffle" onclick="shuffleTeams()" style="flex:0.8; margin-top:0;">
          🎲 섞기
        </button>
      </div>
    </div>

    <!-- 검색창 (코드입력 대체) -->
    <div class="panel-box">
      <div class="section-title">미션 검색 (이름/내용/코드)</div>
      <div class="code-row">
        <input type="text" class="code-input" id="search-input" placeholder="검색어를 입력하세요 (예: 금지, 웃음)"
          oninput="filterCards()">
      </div>
      <div class="code-hint">입력 시 실시간으로 오른쪽 목록이 필터링됩니다.</div>
    </div>

    <!-- 미리보기 -->
    <div class="panel-box">
      <div class="section-title">선택된 카드 미리보기 (더블클릭시 크게 송출)</div>
      <div class="preview-wrap" id="preview-wrap">
        <div class="preview-empty" id="preview-empty">목록에서 카드를 선택해 주세요</div>
        <div id="preview-card" style="display:none;">
          <div class="preview-card" id="dom-preview-card">
            <span class="pc-emoji" id="pc-emoji"></span>
            <div class="pc-badge" id="pc-badge"></div>
            <div class="pc-name" id="pc-name"></div>
            <div class="pc-desc" id="pc-desc"></div>
            <div class="pc-code" id="pc-code"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 현재 중앙 송출 현황 패널 -->
    <div class="panel-box" id="highlight-status-box" style="display:none;">
      <div class="section-title">📺 현재 중앙 송출 중 (대기)</div>
      <div class="highlight-info-row" style="display:flex; align-items:center; justify-content:space-between; background:#110700; padding:0.6rem; border-radius:8px; border:1px solid var(--wood-dark);">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span id="hl-emoji" style="font-size:1.5rem;"></span>
          <div>
            <div id="hl-name" style="font-size:0.75rem; font-weight:bold; color:var(--gold-light);"></div>
            <div id="hl-code" style="font-size:0.58rem; color:var(--wood-light); font-weight:bold;"></div>
          </div>
        </div>
        <button class="btn-slot-clear" onclick="cancelHighlight()" style="width:24px; height:24px; font-size:0.62rem; line-height:1; flex-shrink:0;">✕</button>
      </div>
    </div>

    <!-- 송출 대상 슬롯 지정 -->
    <div class="panel-box">
      <div class="section-title">송출 대상 슬롯 지정 및 관리</div>
      <div style="margin-bottom:0.6rem; display:flex; gap:2px;">
        <button class="btn-slot-common" id="btn-slot-common" onclick="broadcastTo('common')" style="flex:1;">
          📢 공통 카드 슬롯에 배치 [빈 슬롯]
        </button>
        <button class="btn-slot-clear" id="btn-clear-common" onclick="clearSlot('common')" style="display:none; height:auto; width:30px; font-size:0.75rem;">✕</button>
      </div>
      <div class="slot-list" id="slot-list-container"></div>
    </div>

  </div>

  <!-- 카드 목록 -->
  <div class="op-right">
    <div class="section-title" style="margin-bottom:.8rem;">전체 카드 목록 — 클릭 시 선택 / 더블클릭 시 큰 카드로 송출</div>
    <div class="card-grid" id="card-grid"></div>
  </div>
</div>

<script>
let currentCard = null;
let bcWindow = null;

// 통합 게임 상태 정의
let gameState = {
  round: 1,
  turnOrder: ['1팀', '2팀', '3팀', '4팀', '5팀', '6팀'],
  teamNames: {
    '1팀': '1팀',
    '2팀': '2팀',
    '3팀': '3팀',
    '4팀': '4팀',
    '5팀': '5팀',
    '6팀': '6팀'
  },
  commonCard: null,
  teamSlots: {
    '1팀': [null, null],
    '2팀': [null, null],
    '3팀': [null, null],
    '4팀': [null, null],
    '5팀': [null, null],
    '6팀': [null, null],
  },
  activeRules: [],
  highlightCard: null, // 중앙 크게 보여주는 카드 정보
  lastPlaced: null, // 슬롯 이동 연출용 배치 정보
  usedCardCodes: [] // 송출 완료된 카드 코드 이력
};

// 페이지 로드 시 로컬스토리지에서 기존 상태 복구
function loadSavedState() {
  const saved = localStorage.getItem('babo_broadcast');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.type === 'sync_state' && parsed.state) {
        gameState = parsed.state;
        if (!gameState.teamNames) {
          gameState.teamNames = {
            '1팀': '1팀', '2팀': '2팀', '3팀': '3팀',
            '4팀': '4팀', '5팀': '5팀', '6팀': '6팀'
          };
        }
        if (!gameState.usedCardCodes) {
          gameState.usedCardCodes = [];
        }
      }
    } catch(e) {}
  }
}
loadSavedState();

/* ── 송출 화면 열기 ── */
function openBroadcast(){
  bcWindow = window.open('index.html','babobtime_broadcast','width=1280,height=720');
}

/* ── 상태 발행 ── */
function publishState(){
  localStorage.setItem('babo_broadcast', JSON.stringify({
    type: 'sync_state',
    state: gameState,
    ts: Date.now()
  }));
  updateUI();
}

/* ── 라운드 변경 ── */
function changeRound(d){
  gameState.round = Math.max(1, gameState.round + d);
  publishState();
}

/* ── 게임 초기화 ── */
function resetGame() {
  if (!confirm('정말로 게임을 초기화하시겠습니까?\n모든 배치된 카드 및 사용 이력이 초기 상태로 리셋되며 라운드는 1로 돌아갑니다. (팀 이름은 유지됩니다)')) {
    return;
  }
  
  const currentNames = gameState.teamNames;
  gameState = {
    round: 1,
    turnOrder: ['1팀', '2팀', '3팀', '4팀', '5팀', '6팀'],
    teamNames: currentNames || {
      '1팀': '1팀', '2팀': '2팀', '3팀': '3팀',
      '4팀': '4팀', '5팀': '5팀', '6팀': '6팀'
    },
    commonCard: null,
    teamSlots: {
      '1팀': [null, null], '2팀': [null, null], '3팀': [null, null],
      '4팀': [null, null], '5팀': [null, null], '6팀': [null, null],
    },
    activeRules: [],
    highlightCard: null,
    lastPlaced: null,
    usedCardCodes: []
  };
  
  // 검색 인풋창 초기화
  const search = document.getElementById('search-input');
  if (search) {
    search.value = '';
    filterCards();
  }
  
  publishState();
}

/* ── 팀 이름 및 순서 제어 ── */
function renderTurnOrder(){
  const container = document.getElementById('team-order-list');
  container.innerHTML = '';
  gameState.turnOrder.forEach((teamId, idx) => {
    const currentName = gameState.teamNames[teamId] || teamId;
    const item = document.createElement('div');
    item.className = 'team-order-item';
    item.innerHTML = `
      <div style="display:flex; align-items:center; gap:0.4rem; flex:1;">
        <span style="font-size:0.7rem; color:var(--gold); font-weight:bold; width:15px;">${idx + 1}</span>
        <input type="text" class="team-name-input" value="${currentName}" 
          onchange="updateTeamName('${teamId}', this.value)"
          onkeydown="if(event.key==='Enter') { this.blur(); updateTeamName('${teamId}', this.value); }"
          style="background:transparent; border:none; border-bottom:1px dashed var(--wood-mid); color:var(--cream); font-family:inherit; font-size:0.75rem; font-weight:bold; outline:none; width:80%; padding:0.1rem 0.2rem;"
          placeholder="${teamId} 이름">
      </div>
      <div class="team-order-ctrls">
        <button class="btn-order-move" onclick="moveTeam(${idx}, -1)" ${idx === 0 ? 'style="opacity:0.2; pointer-events:none;"' : ''}>▲</button>
        <button class="btn-order-move" onclick="moveTeam(${idx}, 1)" ${idx === 5 ? 'style="opacity:0.2; pointer-events:none;"' : ''}>▼</button>
      </div>
    `;
    container.appendChild(item);
  });
}

function updateTeamName(teamId, newName) {
  const cleanName = newName.trim();
  gameState.teamNames[teamId] = cleanName || teamId;
  publishState();
}

function moveTeam(idx, dir){
  const targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= gameState.turnOrder.length) return;
  const temp = gameState.turnOrder[idx];
  gameState.turnOrder[idx] = gameState.turnOrder[targetIdx];
  gameState.turnOrder[targetIdx] = temp;
  publishState();
}

function shuffleTeams(){
  for (let i = gameState.turnOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = gameState.turnOrder[i];
    gameState.turnOrder[i] = gameState.turnOrder[j];
    gameState.turnOrder[j] = temp;
  }
  publishState();
}

function rotateTurn() {
  if (gameState.turnOrder && gameState.turnOrder.length > 0) {
    const current = gameState.turnOrder.shift();
    gameState.turnOrder.push(current);
  }
}

function nextTurn() {
  rotateTurn();
  publishState();
}

/* ── 미션 검색 필터링 ── */
function filterCards() {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  const thumbs = document.querySelectorAll('.card-thumb');
  const visibleCount = { common: 0, team: 0, special: 0 };
  
  thumbs.forEach(thumb => {
    const code = thumb.getAttribute('data-code');
    const card = CARD_DB[code];
    const match = card.name.toLowerCase().includes(query) || 
                  card.desc.toLowerCase().includes(query) || 
                  code.toLowerCase().includes(query);
    
    if (match) {
      thumb.style.display = 'block';
      visibleCount[card.type]++;
    } else {
      thumb.style.display = 'none';
    }
  });
  
  // 그룹 헤더 제어
  const headers = document.querySelectorAll('.group-header');
  headers.forEach(h => {
    const type = h.getAttribute('data-type');
    if (visibleCount[type] > 0) {
      h.style.display = 'block';
    } else {
      h.style.display = 'none';
    }
  });
}

/* ── 카드 선택 ── */
function selectCard(code){
  const card = CARD_DB[code];
  currentCard = {code,...card};
  
  // 썸네일 하이라이트
  document.querySelectorAll('.card-thumb').forEach(e=>e.classList.remove('selected'));
  const th = document.getElementById('thumb-'+code);
  if(th){th.classList.add('selected');}
  
  // 미리보기
  const meta = TYPE_META[card.type];
  document.getElementById('preview-empty').style.display = 'none';
  document.getElementById('preview-card').style.display = 'block';
  document.getElementById('pc-emoji').textContent = card.emoji;
  document.getElementById('pc-name').textContent = card.name;
  document.getElementById('pc-desc').textContent = card.desc;
  document.getElementById('pc-code').textContent = code;
  const b = document.getElementById('pc-badge');
  b.textContent = meta.label; b.style.background = meta.bg; b.style.color = meta.color;
  
  // 미리보기 카드 더블클릭 핸들러 바인딩
  const domPreview = document.getElementById('dom-preview-card');
  domPreview.ondblclick = () => {
    publishHighlight(currentCard);
  };
}

/* ── 큰 카드 하이라이트 송출 ── */
function publishHighlight(card) {
  if (!card) return;
  
  gameState.highlightCard = {
    card: card,
    ts: Date.now()
  };
  gameState.lastPlaced = null; // 비행 연출 초기화
  
  // 송출 이력 추가 (중복 방지)
  if (!gameState.usedCardCodes) {
    gameState.usedCardCodes = [];
  }
  if (!gameState.usedCardCodes.includes(card.code)) {
    gameState.usedCardCodes.push(card.code);
  }
  
  document.getElementById('live-badge').textContent = '🔴 LIVE 송출 중';
  document.getElementById('live-badge').classList.add('on');
  
  publishState();
}

function cancelHighlight() {
  gameState.highlightCard = null;
  gameState.lastPlaced = null;
  publishState();
}

/* ── 카드 실제 슬롯에 배치 ── */
function broadcastTo(target, slotIdx){
  let cardToPlace = null;
  
  if (gameState.highlightCard && gameState.highlightCard.card) {
    cardToPlace = gameState.highlightCard.card;
  } else if (currentCard) {
    cardToPlace = currentCard;
  }
  
  if (!cardToPlace) {
    alert('먼저 송출할 카드를 선택(또는 더블클릭)해 주세요!');
    return;
  }
  
  // 비행 연출 정보 전달
  gameState.lastPlaced = {
    target: target,
    slotIdx: slotIdx,
    card: cardToPlace,
    ts: Date.now()
  };
  
  gameState.highlightCard = null;
  
  if (target === 'common') {
    gameState.commonCard = cardToPlace;
    if (!gameState.activeRules.some(r => r.code === cardToPlace.code)) {
      gameState.activeRules.push(cardToPlace);
    }
  } else {
    gameState.teamSlots[target][slotIdx] = cardToPlace;
  }
  
  // 공통 및 팀 슬롯 배치 시 턴을 무조건 자동 교대!
  rotateTurn();
  
  publishState();
}

function clearSlot(target, slotIdx){
  if (target === 'common') {
    gameState.commonCard = null;
  } else {
    gameState.teamSlots[target][slotIdx] = null;
  }
  gameState.lastPlaced = null;
  publishState();
}

function removeRule(code) {
  gameState.activeRules = gameState.activeRules.filter(r => r.code !== code);
  publishState();
}

// 슬롯 UI 그리기 및 현황 연동
function renderSlots(){
  const container = document.getElementById('slot-list-container');
  container.innerHTML = '';
  
  // 공통 카드 슬롯 상태 업데이트
  const commBtn = document.getElementById('btn-slot-common');
  const commClear = document.getElementById('btn-clear-common');
  
  commBtn.onclick = () => broadcastTo('common');
  
  if (gameState.commonCard) {
    commBtn.textContent = `📢 공통: ${gameState.commonCard.emoji} ${gameState.commonCard.name}`;
    commBtn.className = 'btn-slot-common active';
    commClear.style.display = 'flex';
  } else {
    commBtn.textContent = `📢 공통 카드 슬롯에 배치 [빈 슬롯]`;
    commBtn.className = 'btn-slot-common';
    commClear.style.display = 'none';
  }

  // 6개 팀 슬롯 리스트 생성
  gameState.turnOrder.forEach(team => {
    const row = document.createElement('div');
    row.className = 'slot-row';
    
    const teamLabel = document.createElement('div');
    teamLabel.className = 'slot-team-name';
    teamLabel.textContent = gameState.teamNames[team] || team;
    row.appendChild(teamLabel);
    
    const btnGroup = document.createElement('div');
    btnGroup.className = 'slot-btn-group';
    
    for (let i = 0; i < 2; i++) {
      const card = gameState.teamSlots[team][i];
      const slotContainer = document.createElement('div');
      slotContainer.className = 'slot-container';
      
      const targetBtn = document.createElement('button');
      targetBtn.className = card ? 'btn-slot-target active' : 'btn-slot-target';
      targetBtn.textContent = card ? `${card.emoji} ${card.name}` : `슬롯 ${i+1}`;
      targetBtn.onclick = () => broadcastTo(team, i);
      slotContainer.appendChild(targetBtn);
      
      if (card) {
        const clearBtn = document.createElement('button');
        clearBtn.className = 'btn-slot-clear';
        clearBtn.textContent = '✕';
        clearBtn.onclick = (e) => {
          e.stopPropagation();
          clearSlot(team, i);
        };
        slotContainer.appendChild(clearBtn);
      }
      
      btnGroup.appendChild(slotContainer);
    }
    row.appendChild(btnGroup);
    container.appendChild(row);
  });
}

function updateActiveRulesUI(){
  const el = document.getElementById('op-active-rules');
  if(!gameState.activeRules || !gameState.activeRules.length){
    el.innerHTML = '<span style="color:rgba(160,113,79,.35);font-size:.67rem;">없음</span>';
    return;
  }
  el.innerHTML = gameState.activeRules.map(r => `
    <span class="rule-mini-chip">
      ${r.emoji} ${r.name}
      <button class="btn-rule-del" onclick="removeRule('${r.code}')">✕</button>
    </span>
  `).join('');
}

// 현재 중앙 송출 상태 패널 UI 갱신
function updateHighlightUI() {
  const box = document.getElementById('highlight-status-box');
  if (gameState.highlightCard && gameState.highlightCard.card) {
    const card = gameState.highlightCard.card;
    document.getElementById('hl-emoji').textContent = card.emoji;
    document.getElementById('hl-name').textContent = card.name;
    document.getElementById('hl-code').textContent = card.code;
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

// 송출 이력을 기준으로 카드를 흐림 비활성화
function updateUsedCards() {
  const usedCodes = new Set(gameState.usedCardCodes || []);
  
  const thumbs = document.querySelectorAll('.card-thumb');
  thumbs.forEach(thumb => {
    const code = thumb.getAttribute('data-code');
    if (usedCodes.has(code)) {
      thumb.classList.add('used');
    } else {
      thumb.classList.remove('used');
    }
  });
}

// 종합 UI 업데이트
function updateUI(){
  document.getElementById('round-num').textContent = gameState.round;
  renderTurnOrder();
  renderSlots();
  updateActiveRulesUI();
  updateHighlightUI();
  updateUsedCards();
}

/* ── 카드 그리드 ── */
function buildGrid(){
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  const groups = {common:[],team:[],special:[]};
  Object.entries(CARD_DB).forEach(([code,card])=>groups[card.type].push({code,...card}));
  ['common','team','special'].forEach(type=>{
    const meta = TYPE_META[type];
    
    const h = document.createElement('div');
    h.className = 'group-header';
    h.setAttribute('data-type', type);
    h.style.cssText = `background:${meta.bg}18;border:1px solid ${meta.bg}55;color:${meta.color}`;
    h.textContent = `${meta.label} 카드 (${groups[type].length}장)`;
    grid.appendChild(h);
    
    groups[type].forEach(card=>{
      const el = document.createElement('div');
      el.className = 'card-thumb'; 
      el.id = 'thumb-'+card.code;
      el.setAttribute('data-code', card.code);
      el.innerHTML = `<div class="ct-emoji">${card.emoji}</div>
        <div class="ct-name">${card.name}</div>
        <div class="ct-code">${card.code}</div>
        <div class="ct-type" style="background:${meta.bg};color:${meta.color}">${meta.label}</div>`;
      
      // 클릭 시 단순 선택
      el.addEventListener('click',()=>selectCard(card.code));
      
      // 더블클릭 시 큰 카드로 중앙에 1차 송출 (배치 대기 상태)
      el.addEventListener('dblclick',()=>publishHighlight({code: card.code, ...CARD_DB[card.code]}));
      
      grid.appendChild(el);
    });
  });
}

// 초기화 실행
buildGrid();
updateUI();
</script>
