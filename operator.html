<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바보타임 — 운영진 패널</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script src="cards.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap');
:root {
  --wood-dark:#3D2610;--wood-mid:#6B4728;--wood-light:#A0714F;
  --gold:#C9922A;--gold-light:#E8B84B;--cream:#F5EDD8;
  --red:#C0392B;--text-dark:#1A0F00;
  /* 팀 색상 */
  --team-green: #27AE60;
  --team-orange: #E67E22;
  --team-blue: #2980B9;
  --team-yellow: #F1C40F;
  --team-purple: #8E44AD;
  --team-pink: #E91E8C;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#0f0800;color:var(--cream);min-height:100vh;}

.op-header{
  background:#1A0F00;border-bottom:2px solid var(--wood-mid);
  padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;
}
.op-header-title{font-family:'Noto Serif KR',serif;font-size:1.1rem;color:var(--gold-light);}
.header-right{display:flex;gap:.6rem;align-items:center;}
.live-badge{
  background:rgba(201,146,42,.15);border:1px solid var(--gold);border-radius:8px;
  padding:.3rem .8rem;font-size:.72rem;color:var(--gold);font-weight:700;letter-spacing:.04em;
  transition:all .3s;
}
.live-badge.on{background:rgba(192,57,43,.2);border-color:#E74C3C;color:#E74C3C;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

.btn-open-bc{
  background:var(--gold);color:#1A0F00;border:none;border-radius:8px;
  padding:.4rem .9rem;font-size:.78rem;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;
}
.btn-open-bc:hover{background:var(--gold-light);}

.btn-reset {
  background: rgba(192, 57, 43, 0.12);
  border: 1.5px solid var(--red);
  color: #E74C3C;
  border-radius: 8px;
  padding: .4rem .9rem;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all .15s;
  white-space: nowrap;
}
.btn-reset:hover {
  background: var(--red);
  color: #fff;
}

.op-body{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px);}

/* ── 왼쪽 사이드바 ── */
.op-left{background:#140900;border-right:2px solid var(--wood-dark);padding:1rem;display:flex;flex-direction:column;gap:0.8rem;overflow-y:auto;max-height:calc(100vh - 60px);}
.section-title{font-size:.68rem;font-weight:700;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;}

.panel-box{background:#1A0F00;border:1.5px solid var(--wood-dark);border-radius:12px;padding:0.85rem;}

/* 통합 제어 보드 테이블화 */
.team-board-list{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.6rem;}
.team-row{
  display:flex;align-items:center;
  background:#110700;border:1px solid var(--wood-dark);border-radius:8px;
  padding:0.4rem 0.5rem;gap:0.45rem;
}
.tr-num{font-size:0.75rem;color:var(--gold);font-weight:bold;width:15px;text-align:center;}
.tr-color-dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,255,255,0.25);
}
.tr-team-label{
  font-size:0.78rem;font-weight:bold;color:var(--cream);
  width:42px;flex-shrink:0;white-space:nowrap;
}
.tr-slots{display:flex;gap:3px;flex:1;}
.slot-container{display:flex;flex:1;gap:1px;}
.btn-slot-target{
  flex:1;padding:0.35rem 0.4rem;font-size:0.65rem;border-radius:4px;
  border:1px solid var(--wood-dark);background:#0d0500;color:rgba(255,255,255,0.35);
  cursor:pointer;transition:all 0.15s;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.btn-slot-target:hover{border-color:var(--gold);color:var(--cream);}
.btn-slot-target.active{
  background:rgba(201,146,42,0.12);border-color:var(--gold);color:var(--gold-light);
  font-weight:bold;
}
.btn-slot-clear{
  background:rgba(192, 57, 43, 0.12);border:1px solid var(--red);color:#E74C3C;
  border-radius:4px;width:18px;height:18px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:0.55rem;flex-shrink:0;
  transition:all 0.15s;align-self:center;
}
.btn-slot-clear:hover{background:var(--red);color:#fff;}

.tr-ctrls{display:flex;gap:1px;width:34px;justify-content:flex-end;}
.btn-order-move{
  background:transparent;border:none;color:var(--gold);cursor:pointer;
  font-size:0.7rem;padding:0.1rem 0.2rem;font-weight:bold;
}
.btn-order-move:hover{color:var(--gold-light);}

.btn-shuffle{
  padding:0.45rem;background:transparent;border:1.5px dashed var(--gold);
  color:var(--gold-light);border-radius:8px;font-size:0.72rem;font-weight:700;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;
}
.btn-shuffle:hover{background:rgba(201,146,42,0.1);}

/* 공통 슬롯 */
.common-slot-container {
  display: flex; gap: 4px; align-items: center; width: 100%;
}
.btn-slot-common{
  flex: 1; padding:0.55rem; font-size:0.75rem; border-radius:8px;
  border:1.5px solid var(--gold); background:#110700; color:rgba(255,255,255,0.4);
  cursor:pointer; transition:all 0.15s; text-align:center; font-weight:bold;
}
.btn-slot-common:hover{background:rgba(201,146,42,0.08); color:var(--cream);}
.btn-slot-common.active{
  background:rgba(201,146,42,0.22); color:var(--gold-light); border-color:var(--gold-light); box-shadow:0 0 10px rgba(201,146,42,0.15);
}

/* 카드 제어 센터 통합 미리보기/송출 */
.ctrl-center-box{min-height:115px;display:flex;flex-direction:column;justify-content:center;}
.ctrl-center-empty{text-align:center;color:rgba(160,113,79,.35);font-size:.78rem;line-height:1.6;padding:0.5rem 0;}
.ctrl-card-info{display:flex;gap:0.7rem;align-items:center;background:#110700;padding:0.5rem;border-radius:8px;border:1px solid var(--wood-dark);}
.cc-emoji{font-size:2.2rem;line-height:1;}
.cc-details{flex:1;min-width:0;}
.cc-header-row{display:flex;align-items:center;gap:0.35rem;margin-bottom:0.15rem;}
.cc-badge{font-size:0.52rem;font-weight:700;border-radius:4px;padding:0.05rem 0.35rem;}
.cc-name{font-family:'Noto Serif KR',serif;font-size:0.8rem;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc-desc{font-size:0.62rem;color:var(--wood-light);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cc-actions{display:flex;gap:0.35rem;margin-top:0.45rem;}
.btn-action-main{
  flex:1;padding:0.35rem;font-size:0.7rem;font-weight:bold;border-radius:6px;
  cursor:pointer;transition:all 0.15s;border:none;text-align:center;
}
.btn-action-main.highlight{
  background:var(--gold);color:#1A0F00;
}
.btn-action-main.highlight:hover{background:var(--gold-light);}
.btn-action-main.cancel{
  background:rgba(192, 57, 43, 0.15);border:1.5px solid var(--red);color:#E74C3C;
}
.btn-action-main.cancel:hover{background:var(--red);color:#fff;}

/* 검색창 */
.code-input{
  flex:1;background:#0f0800;border:2px solid var(--wood-mid);border-radius:8px;
  color:var(--gold-light);font-family:'Noto Sans KR',sans-serif;
  font-size:0.92rem;font-weight:500;padding:.55rem .9rem;outline:none;
  transition:border-color .15s;
}
.code-input:focus{border-color:var(--gold);}
.code-input::placeholder{color:rgba(160,113,79,.35);font-size:.82rem;letter-spacing:.02em;}

/* ── 오른쪽: 카드 목록 ── */
.op-right{padding:1.2rem;overflow-y:auto;max-height:100vh;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem;}
.group-header{
  grid-column:1/-1;font-size:.65rem;font-weight:700;border-radius:6px;
  padding:.28rem .65rem;margin-top:.5rem;letter-spacing:.06em;
}

/* 카드 썸네일 및 사용됨 스타일 */
.card-thumb{
  background:#1A0F00;border:1.5px solid var(--wood-dark);border-radius:10px;
  padding:.7rem .5rem;text-align:center;cursor:pointer;user-select:none;transition:all .2s;
  position: relative;
}
.card-thumb:hover{border-color:var(--gold);background:#251508;}
.card-thumb.selected{border-color:var(--gold);background:rgba(201,146,42,.15);}
.card-thumb.blue-team-card { border-color: #0A369D; }
.card-thumb.orange-team-card { border-color: #e67e22; }

/* 배치됨(사용됨) 마크 */
.card-thumb.used {
  opacity: 0.35;
  filter: grayscale(70%) blur(0.4px);
}
.card-thumb.used::after {
  content: '사용됨';
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--red);
  color: #fff;
  font-size: 0.52rem;
  font-weight: bold;
  padding: 0.08rem 0.25rem;
  border-radius: 4px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

.ct-emoji{font-size:1.5rem;margin-bottom:.25rem;}
.ct-name{font-size:.68rem;color:var(--cream);font-weight:700;margin-bottom:.2rem;line-height:1.2;}
.ct-code{font-size:.58rem;color:var(--wood-light);font-weight:700;letter-spacing:.07em;background:rgba(0,0,0,.3);border-radius:4px;padding:.08rem .3rem;display:inline-block;}
.ct-type{font-size:.55rem;border-radius:4px;padding:.08rem .3rem;display:inline-block;margin-top:.18rem;font-weight:700;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--wood-dark);border-radius:2px;}
.card-img-fit {
  width: 100%;
  height: 100%;
  object-fit: fill;
  border-radius: inherit;
}
</style>
</head>
<body>

<div class="op-header">
  <div class="op-header-title">🎛️ 바보타임 — 운영진 패널</div>
  <div class="header-right">
    <div style="display:flex; align-items:center; gap:0.4rem; background:rgba(255,255,255,0.05); padding:0.2rem 0.5rem; border-radius:6px; border:1px solid var(--wood-mid);">
      <span style="font-size:0.7rem; color:var(--gold); font-weight:700;">방 코드:</span>
      <input type="text" id="room-id-input" value="babo-game-live-777" style="width:130px; background:#000; color:#fff; border:1px solid var(--gold); border-radius:4px; padding:0.15rem 0.4rem; font-size:0.72rem; font-weight:bold;" />
      <button onclick="changeRoomId()" style="background:var(--gold); color:#000; border:none; border-radius:4px; padding:0.15rem 0.4rem; font-size:0.7rem; font-weight:bold; cursor:pointer;">연동</button>
    </div>
    <button class="btn-reset" onclick="resetGame()">🔄 게임 초기화</button>
    <div class="live-badge" id="live-badge">⚫ 대기 중</div>
    <button class="btn-open-bc" onclick="openBroadcast()">📺 송출 화면 열기</button>
  </div>
</div>

<div class="op-body">
  <div class="op-left">



    <!-- 카드 제어 센터 (통합 미리보기 / 송출) -->
    <div class="panel-box ctrl-center-box" id="ctrl-center-box">
      <!-- 동적 바인딩 -->
    </div>

    <!-- 공통 카드 슬롯 관리 -->
    <div class="panel-box">
      <div class="section-title">📢 공통 카드 슬롯</div>
      <div class="common-slot-container">
        <button class="btn-slot-common" id="btn-slot-common" onclick="broadcastTo('common')">
          공통 카드 슬롯에 배치 [빈 슬롯]
        </button>
        <button class="btn-slot-clear" id="btn-clear-common" onclick="clearSlot('common')" style="display:none; height:34px; width:34px; font-size:0.75rem;">✕</button>
      </div>
    </div>

    <!-- 6팀 통합 관리 보드 -->
    <div class="panel-box">
      <div class="section-title">👥 팀별 순서 및 슬롯 관리 (이름수정 / 배치)</div>
      <div class="team-board-list" id="team-board-list">
        <!-- 6개 팀 데이터가 1행 단위로 렌더링됩니다 -->
      </div>
      <div style="display:flex; gap:0.4rem; margin-top:0.35rem;">
        <button class="btn-shuffle" onclick="nextTurn()" style="flex:1; margin-top:0; border-style:solid; background:rgba(201,146,42,0.12);">
          ➔ 다음 차례 넘기기
        </button>
      </div>
    </div>

  </div>

  <!-- 카드 목록 (검색 필드가 상단에 넓게 배치됨) -->
  <div class="op-right">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1.5rem;">
      <div class="section-title" style="margin-bottom:0; font-size:0.8rem;">전체 카드 목록 — 클릭 시 선택 / 더블클릭 시 큰 카드로 송출</div>
      <div style="width:350px;">
        <input type="text" class="code-input" id="search-input" placeholder="🔍 미션 검색 (이름, 내용, 코드)"
          oninput="filterCards()" style="padding: 0.45rem 0.8rem; font-size: 0.8rem; border-radius: 6px;">
      </div>
    </div>
    <div class="card-grid" id="card-grid"></div>
  </div>
</div>

<script>
let currentCard = null;
let bcWindow = null;

// 통합 게임 상태 정의
// 팀 색상 & 이름 정의
const TEAM_CONFIG = {
  '1팀': { name: '그린',  color: '#27AE60' },
  '2팀': { name: '렌지',  color: '#E67E22' },
  '3팀': { name: '블루',  color: '#2980B9' },
  '4팀': { name: '옐로',  color: '#F1C40F' },
  '5팀': { name: '퍼플',  color: '#8E44AD' },
  '6팀': { name: '핑크',  color: '#E91E8C' },
};

let gameState = {
  round: 1,
  turnOrder: ['1팀', '2팀', '3팀', '4팀', '5팀', '6팀'],
  teamNames: {
    '1팀': '그린',
    '2팀': '렌지',
    '3팀': '블루',
    '4팀': '옐로',
    '5팀': '퍼플',
    '6팀': '핑크'
  },
  commonCard: null,
  teamSlots: {
    '1팀': [null, null],
    '2팀': [null, null],
    '3팀': [null, null],
    '4팀': [null, null],
    '5팀': [null, null],
    '6팀': [null, null],
  },
  activeRules: [],
  highlightCard: null,
  lastPlaced: null,
  usedCardCodes: []
};

// 페이지 로드 시 로컬스토리지에서 기존 상태 복구
function loadSavedState() {
  const saved = localStorage.getItem('babo_broadcast');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.type === 'sync_state' && parsed.state) {
        gameState = parsed.state;
        if (!gameState.teamNames) {
          gameState.teamNames = {
            '1팀': '그린', '2팀': '렌지', '3팀': '블루',
            '4팀': '옐로', '5팀': '퍼플', '6팀': '핑크'
          };
        }
        if (!gameState.usedCardCodes) {
          gameState.usedCardCodes = [];
        }
      }
    } catch(e) {}
  }
}
loadSavedState();

/* ── 무설정 실시간 네트워크 동기화 (MQTT over WebSocket + PeerJS + LocalStorage) ── */
let currentRoomId = (new URLSearchParams(window.location.search)).get('room') || localStorage.getItem('babo_room_id') || 'babo-game-live-777';
let mqttClient = null;

function getMqttTopic() {
  return 'babogame/room/' + currentRoomId + '/state';
}

function updateRoomInputUI() {
  const input = document.getElementById('room-id-input');
  if (input) input.value = currentRoomId;
}

function changeRoomId() {
  const input = document.getElementById('room-id-input');
  if (!input) return;
  const newRoom = input.value.trim();
  if (!newRoom) return alert('방 코드를 입력해주세요.');

  currentRoomId = newRoom;
  localStorage.setItem('babo_room_id', currentRoomId);

  initMqttSender();
  initPeerSender();
  publishState();
  alert('방 코드가 [' + currentRoomId + '] (으)로 변경 및 연동되었습니다.');
}

/* ── 1. MQTT 실시간 송신기 ── */
function initMqttSender() {
  if (mqttClient) {
    try { mqttClient.end(true); } catch(e) {}
  }

  const badge = document.getElementById('live-badge');
  if (badge) badge.textContent = '🟡 MQTT 연결 중...';

  const brokers = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://test.mosquitto.org:8081',
    'wss://broker.hivemq.com:8884/mqtt'
  ];

  function connectBroker(idx) {
    if (typeof mqtt === 'undefined') return;
    const url = brokers[idx % brokers.length];
    const clientId = 'babo_op_' + Math.random().toString(16).substring(2, 10);

    try {
      mqttClient = mqtt.connect(url, {
        clientId: clientId,
        clean: true,
        connectTimeout: 4000,
        reconnectPeriod: 3000
      });

      mqttClient.on('connect', () => {
        console.log('MQTT 연결 성공:', url);
        if (badge) {
          badge.textContent = '🟢 실시간 연동 중';
          badge.classList.remove('on');
        }
        publishState();
      });

      mqttClient.on('error', (err) => {
        console.warn('MQTT 에러:', err);
      });

      mqttClient.on('offline', () => {
        if (badge) badge.textContent = '🟡 재연결 시도 중...';
      });
    } catch(e) {
      console.error('MQTT 초기화 실패:', e);
    }
  }

  connectBroker(0);
}

/* ── 2. PeerJS 원격 송신기 ── */
let peerOperator = null;
let activePeerConnections = [];

function initPeerSender() {
  if (typeof Peer === 'undefined') return;
  if (peerOperator && !peerOperator.destroyed) {
    try { peerOperator.destroy(); } catch(e) {}
  }

  try {
    peerOperator = new Peer();

    peerOperator.on('open', () => {
      connectToDisplayHost();
    });

    peerOperator.on('error', () => {
      setTimeout(connectToDisplayHost, 3000);
    });
  } catch (err) {}
}

function connectToDisplayHost() {
  if (!peerOperator || peerOperator.destroyed) return;

  const conn = peerOperator.connect(currentRoomId, { reliable: true });

  conn.on('open', () => {
    console.log('PeerJS Direct 연결 성공!');
    if (!activePeerConnections.includes(conn)) {
      activePeerConnections.push(conn);
    }
    publishState();
  });

  conn.on('close', () => {
    activePeerConnections = activePeerConnections.filter(c => c !== conn);
    setTimeout(connectToDisplayHost, 3000);
  });

  conn.on('error', () => {
    setTimeout(connectToDisplayHost, 3000);
  });
}

setTimeout(() => {
  updateRoomInputUI();
  initMqttSender();
  initPeerSender();
}, 200);

/* ── 송출 화면 열기 ── */
function openBroadcast(){
  bcWindow = window.open('index.html?room=' + encodeURIComponent(currentRoomId), 'babobtime_broadcast', 'width=1280,height=720');
}

/* ── 상태 발행 ── */
function publishState(){
  const payload = {
    type: 'sync_state',
    state: gameState,
    roomId: currentRoomId,
    ts: Date.now()
  };

  const payloadStr = JSON.stringify(payload);

  // 1. 로컬 스토리지 저장 (동일 기기 브라우저 탭 간 실시간 연동)
  localStorage.setItem('babo_broadcast', payloadStr);

  // 2. MQTT over WebSocket 원격 브로드캐스트 (전 세계 전자기기 실시간 연동)
  if (mqttClient && mqttClient.connected) {
    try {
      mqttClient.publish(getMqttTopic(), payloadStr, { qos: 1, retain: true });
    } catch(err) {
      console.error('MQTT 송신 에러:', err);
    }
  }

  // 3. PeerJS Direct WebRTC 송신
  activePeerConnections.forEach(conn => {
    if (conn && conn.open) {
      try {
        conn.send(payload);
      } catch (err) {}
    }
  });

  updateUI();
}

/* ── 게임 초기화 ── */
function resetGame() {
  // 포커스 강제 해제로 뒤늦은 onchange 격발 차단
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }

  if (!confirm('정말로 게임을 초기화하시겠습니까?\n모든 배치된 카드 및 사용 이력이 초기 상태로 리셋됩니다. (팀 이름은 유지됩니다)')) {
    return;
  }
  
  gameState = {
    round: 1,
    turnOrder: ['1팀', '2팀', '3팀', '4팀', '5팀', '6팀'],
    teamNames: {
      '1팀': '그린', '2팀': '렌지', '3팀': '블루',
      '4팀': '옐로', '5팀': '퍼플', '6팀': '핑크'
    },
    commonCard: null,
    teamSlots: {
      '1팀': [null, null], '2팀': [null, null], '3팀': [null, null],
      '4팀': [null, null], '5팀': [null, null], '6팀': [null, null],
    },
    activeRules: [],
    highlightCard: null,
    lastPlaced: null,
    usedCardCodes: []
  };
  
  // 선택 및 미리보기 상태 완전 초기화
  currentCard = null;
  document.querySelectorAll('.card-thumb').forEach(e=>e.classList.remove('selected'));
  
  // 검색 인풋창 초기화
  const search = document.getElementById('search-input');
  if (search) {
    search.value = '';
    filterCards();
  }
  
  publishState();
}

/* ── 팀 이름 및 순서 제어 ── */
function updateTeamName(teamId, newName) {
  const cleanName = newName.trim();
  gameState.teamNames[teamId] = cleanName || teamId;
  publishState();
}

function moveTeam(idx, dir){
  const targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= gameState.turnOrder.length) return;
  const temp = gameState.turnOrder[idx];
  gameState.turnOrder[idx] = gameState.turnOrder[targetIdx];
  gameState.turnOrder[targetIdx] = temp;
  publishState();
}

function shuffleTeams(){
  for (let i = gameState.turnOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = gameState.turnOrder[i];
    gameState.turnOrder[i] = gameState.turnOrder[j];
    gameState.turnOrder[j] = temp;
  }
  publishState();
}

function rotateTurn() {
  if (gameState.turnOrder && gameState.turnOrder.length > 0) {
    const current = gameState.turnOrder.shift();
    gameState.turnOrder.push(current);
  }
}

function nextTurn() {
  rotateTurn();
  publishState();
}

/* ── 미션 검색 필터링 ── */
function filterCards() {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  const thumbs = document.querySelectorAll('.card-thumb');
  const visibleCount = { common: 0, team: 0, special: 0 };
  
  thumbs.forEach(thumb => {
    const code = thumb.getAttribute('data-code');
    const card = CARD_DB[code];
    const match = card.name.toLowerCase().includes(query) || 
                  card.desc.toLowerCase().includes(query) || 
                  code.toLowerCase().includes(query);
    
    if (match) {
      thumb.style.display = 'block';
      visibleCount[card.type]++;
    } else {
      thumb.style.display = 'none';
    }
  });
  
  // 그룹 헤더 제어
  const headers = document.querySelectorAll('.group-header');
  headers.forEach(h => {
    const type = h.getAttribute('data-type');
    if (visibleCount[type] > 0) {
      h.style.display = 'block';
    } else {
      h.style.display = 'none';
    }
  });
}

/* ── 카드 선택 ── */
function selectCard(code){
  const card = CARD_DB[code];
  currentCard = {code,...card};
  
  // 썸네일 하이라이트
  document.querySelectorAll('.card-thumb').forEach(e=>e.classList.remove('selected'));
  const th = document.getElementById('thumb-'+code);
  if(th){th.classList.add('selected');}
  
  publishState();
}

/* ── 큰 카드 하이라이트 송출 ── */
function publishHighlight(card) {
  if (!card) return;
  
  gameState.highlightCard = {
    card: card,
    ts: Date.now()
  };
  gameState.lastPlaced = null; // 비행 연출 초기화
  
  // 송출 이력 추가 (중복 방지)
  if (!gameState.usedCardCodes) {
    gameState.usedCardCodes = [];
  }
  if (!gameState.usedCardCodes.includes(card.code)) {
    gameState.usedCardCodes.push(card.code);
  }
  
  document.getElementById('live-badge').textContent = '🔴 LIVE 송출 중';
  document.getElementById('live-badge').classList.add('on');
  
  publishState();
}

function cancelHighlight() {
  gameState.highlightCard = null;
  gameState.lastPlaced = null;
  publishState();
}

/* ── 카드 실제 슬롯에 배치 ── */
function broadcastTo(target, slotIdx){
  let cardToPlace = null;
  
  if (gameState.highlightCard && gameState.highlightCard.card) {
    cardToPlace = gameState.highlightCard.card;
  } else if (currentCard) {
    cardToPlace = currentCard;
  }
  
  if (!cardToPlace) {
    alert('먼저 송출할 카드를 선택(또는 더블클릭)해 주세요!');
    return;
  }
  
  // 비행 연출 정보 전달
  gameState.lastPlaced = {
    target: target,
    slotIdx: slotIdx,
    card: cardToPlace,
    ts: Date.now()
  };
  
  gameState.highlightCard = null;
  
  if (target === 'common') {
    gameState.commonCard = cardToPlace;
    if (!gameState.activeRules.some(r => r.code === cardToPlace.code)) {
      gameState.activeRules.push(cardToPlace);
    }
  } else {
    gameState.teamSlots[target][slotIdx] = cardToPlace;
  }
  
  // 공통 및 팀 슬롯 배치 시 턴을 무조건 자동 교대!
  rotateTurn();
  
  publishState();
}

function clearSlot(target, slotIdx){
  if (target === 'common') {
    gameState.commonCard = null;
  } else {
    gameState.teamSlots[target][slotIdx] = null;
  }
  gameState.lastPlaced = null;
  publishState();
}

function removeRule(code) {
  gameState.activeRules = gameState.activeRules.filter(r => r.code !== code);
  publishState();
}

/* ── 통합 팀별 순서 & 슬롯 조작 보드 렌더링 ── */
function renderTeamBoard(){
  const container = document.getElementById('team-board-list');
  container.innerHTML = '';
  
  // 공통 카드 슬롯 상태 업데이트
  const commBtn = document.getElementById('btn-slot-common');
  const commClear = document.getElementById('btn-clear-common');
  
  commBtn.onclick = () => broadcastTo('common');
  
  if (gameState.commonCard) {
    commBtn.textContent = `📢 공통: ${gameState.commonCard.emoji} ${gameState.commonCard.name}`;
    commBtn.className = 'btn-slot-common active';
    commClear.style.display = 'flex';
  } else {
    commBtn.textContent = `📢 공통 카드 슬롯에 배치 [빈 슬롯]`;
    commBtn.className = 'btn-slot-common';
    commClear.style.display = 'none';
  }

  // 6개 팀 1행씩 통합 렌더링
  gameState.turnOrder.forEach((team, idx) => {
    const currentName = gameState.teamNames[team] || team;
    const teamColor = TEAM_CONFIG[team] ? TEAM_CONFIG[team].color : '#888';
    
    const row = document.createElement('div');
    row.className = 'team-row';
    row.style.borderLeft = `3px solid ${teamColor}`;
    
    // 1. 순서 번호
    const numSpan = document.createElement('span');
    numSpan.className = 'tr-num';
    numSpan.textContent = idx + 1;
    row.appendChild(numSpan);
    
    // 2. 팀 색상 원형 뱃지
    const colorDot = document.createElement('span');
    colorDot.className = 'tr-color-dot';
    colorDot.style.background = teamColor;
    colorDot.style.boxShadow = `0 0 6px ${teamColor}88`;
    row.appendChild(colorDot);
    
    // 3. 팀 이름 텍스트 (고정)
    const teamLabel = document.createElement('span');
    teamLabel.className = 'tr-team-label';
    teamLabel.textContent = currentName;
    teamLabel.style.color = teamColor;
    row.appendChild(teamLabel);
    
    // 4. 슬롯 1 & 2
    const slotsDiv = document.createElement('div');
    slotsDiv.className = 'tr-slots';
    
    for (let i = 0; i < 2; i++) {
      const card = gameState.teamSlots[team][i];
      
      const slotContainer = document.createElement('div');
      slotContainer.className = 'slot-container';
      
      const targetBtn = document.createElement('button');
      targetBtn.className = card ? 'btn-slot-target active' : 'btn-slot-target';
      targetBtn.textContent = card ? `${card.emoji} ${card.name}` : `슬롯 ${i+1}`;
      targetBtn.title = card ? card.name : `슬롯 ${i+1}`;
      targetBtn.onclick = () => broadcastTo(team, i);
      slotContainer.appendChild(targetBtn);
      
      if (card) {
        const clearBtn = document.createElement('button');
        clearBtn.className = 'btn-slot-clear';
        clearBtn.textContent = '✕';
        clearBtn.onclick = (e) => {
          e.stopPropagation();
          clearSlot(team, i);
        };
        slotContainer.appendChild(clearBtn);
      }
      
      slotsDiv.appendChild(slotContainer);
    }
    row.appendChild(slotsDiv);
    
    // 5. 순서 조정 화살표
    const ctrlsDiv = document.createElement('div');
    ctrlsDiv.className = 'tr-ctrls';
    
    const upBtn = document.createElement('button');
    upBtn.className = 'btn-order-move';
    upBtn.textContent = '▲';
    if (idx === 0) {
      upBtn.style.opacity = '0.2';
      upBtn.style.pointerEvents = 'none';
    } else {
      upBtn.onclick = () => moveTeam(idx, -1);
    }
    ctrlsDiv.appendChild(upBtn);
    
    const downBtn = document.createElement('button');
    downBtn.className = 'btn-order-move';
    downBtn.textContent = '▼';
    if (idx === gameState.turnOrder.length - 1) {
      downBtn.style.opacity = '0.2';
      downBtn.style.pointerEvents = 'none';
    } else {
      downBtn.onclick = () => moveTeam(idx, 1);
    }
    ctrlsDiv.appendChild(downBtn);
    
    row.appendChild(ctrlsDiv);
    
    container.appendChild(row);
  });
}

// 카드 제어 센터 통합 UI 갱신 (미리보기 & 송출 대기)
function updateControlCenterUI() {
  const box = document.getElementById('ctrl-center-box');
  box.innerHTML = '';
  
  const isHighlighting = gameState.highlightCard && gameState.highlightCard.card;
  const targetCard = isHighlighting ? gameState.highlightCard.card : currentCard;
  
  if (!targetCard) {
    box.innerHTML = `
      <div class="section-title">🃏 카드 송출 제어</div>
      <div class="ctrl-center-empty">
        선택된 카드가 없습니다.<br>
        <span style="font-size:0.68rem;opacity:0.65;">오른쪽 목록에서 클릭(선택)하거나 더블클릭(송출) 하세요.</span>
      </div>
    `;
    // 헤더 상태 라이브 뱃지 원복
    document.getElementById('live-badge').textContent = '⚫ 대기 중';
    document.getElementById('live-badge').classList.remove('on');
    return;
  }
  
  const meta = TYPE_META[targetCard.type];
  
  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = isHighlighting ? '📺 현재 화면에 크게 송출 중 (대기)' : '🃏 선택된 카드 제어';
  box.appendChild(title);
  
  const cardInfo = document.createElement('div');
  cardInfo.className = 'ctrl-card-info';
  const mediaPreview = targetCard.image
    ? `<div class="cc-emoji" style="width: 50px; height: 70px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--wood-dark);">
         <img src="${targetCard.image}" class="card-img-fit" />
       </div>`
    : `<span class="cc-emoji">${targetCard.emoji}</span>`;

  cardInfo.innerHTML = `
    ${mediaPreview}
    <div class="cc-details">
      <div class="cc-header-row">
        <span class="cc-badge" style="background:${meta.bg};color:${meta.color};">${meta.label}</span>
        <span class="cc-name">${targetCard.name}</span>
      </div>
      <div class="cc-desc">${targetCard.desc}</div>
    </div>
  `;
  
  const actions = document.createElement('div');
  actions.className = 'cc-actions';
  
  if (isHighlighting) {
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-action-main cancel';
    cancelBtn.textContent = '✕ 송출 취소';
    cancelBtn.onclick = cancelHighlight;
    actions.appendChild(cancelBtn);
  } else {
    const highlightBtn = document.createElement('button');
    highlightBtn.className = 'btn-action-main highlight';
    highlightBtn.textContent = '⚡ 큰 카드로 화면 송출';
    highlightBtn.onclick = () => publishHighlight(targetCard);
    actions.appendChild(highlightBtn);
  }
  
  cardInfo.appendChild(actions);
  box.appendChild(cardInfo);
}

// 송출 이력을 기준으로 카드를 흐림 비활성화
function updateUsedCards() {
  const usedCodes = new Set(gameState.usedCardCodes || []);
  
  const thumbs = document.querySelectorAll('.card-thumb');
  thumbs.forEach(thumb => {
    const code = thumb.getAttribute('data-code');
    if (usedCodes.has(code)) {
      thumb.classList.add('used');
    } else {
      thumb.classList.remove('used');
    }
  });
}

// 종합 UI 업데이트
function updateUI(){
  renderTeamBoard();
  updateControlCenterUI();
  updateUsedCards();
}

/* ── 카드 그리드 ── */
function buildGrid(){
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  
  const groups = {
    common: [],
    team_blue: [],
    team_orange: [],
    special: []
  };
  
  Object.entries(CARD_DB).forEach(([code, card]) => {
    if (card.type === 'team') {
      if (card.color === 'blue') {
        groups.team_blue.push({code, ...card});
      } else {
        groups.team_orange.push({code, ...card});
      }
    } else {
      groups[card.type].push({code, ...card});
    }
  });

  const types = ['common', 'team_blue', 'team_orange', 'special'];

  types.forEach(type => {
    const meta = TYPE_META[type];
    if (!meta) return;
    
    const h = document.createElement('div');
    h.className = 'group-header';
    h.setAttribute('data-type', type);
    h.style.cssText = `background:${meta.bg}18;border:1px solid ${meta.bg}55;color:${meta.color}`;
    h.textContent = `${meta.label} (${groups[type].length}장)`;
    grid.appendChild(h);
    
    groups[type].forEach(card => {
      const el = document.createElement('div');
      el.className = 'card-thumb'; 
      el.id = 'thumb-' + card.code;
      el.setAttribute('data-code', card.code);
      
      if (type === 'team_blue') el.classList.add('blue-team-card');
      if (type === 'team_orange') el.classList.add('orange-team-card');

      const mediaHtml = card.image
        ? `<div class="ct-emoji" style="height: 40px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; margin-bottom: 0.25rem;">
             <img src="${card.image}" class="card-img-fit" style="object-fit: cover;" />
           </div>`
        : `<div class="ct-emoji">${card.emoji}</div>`;

      el.innerHTML = `${mediaHtml}
        <div class="ct-name">${card.name}</div>
        <div class="ct-code">${card.code}</div>
        <div class="ct-type" style="background:${meta.bg};color:${meta.color}">${meta.label}</div>`;
      
      // 클릭 시 단순 선택
      el.addEventListener('click', () => selectCard(card.code));
      
      // 더블클릭 시 큰 카드로 중앙에 1차 송출 (배치 대기 상태)
      el.addEventListener('dblclick', () => publishHighlight({code: card.code, ...CARD_DB[card.code]}));
      
      grid.appendChild(el);
    });
  });
}

// 초기화 실행
async function initOperator() {
  await loadDynamicCards();
  buildGrid();
  updateUI();
}
initOperator();
