<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바보타임 — 송출 화면</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script src="cards.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NeoDunggeunmo.woff');

:root {
  --gold: #C9922A;
  --gold-light: #E8B84B;
  --cream: #F5EDD8;
  --wood-light: #A0714F;
  --wood-dark: #3D2610;
  --text-dark: #1A0F00;
  /* 팀 색상 */
  --team-green: #27AE60;
  --team-orange: #E67E22;
  --team-blue: #2980B9;
  --team-yellow: #F1C40F;
  --team-purple: #8E44AD;
  --team-pink: #E91E8C;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'NeoDunggeunmo', sans-serif;
}

body {
  background: url('sunset_bg.png') no-repeat center center fixed;
  background-size: cover;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

/* 화면 전체에 어두운 비네팅 효과 (가독성 증대) */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.45) 100%);
  pointer-events: none;
  z-index: 1;
}

/* LIVE 뱃지 */
.live-badge {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  background: #C0392B;
  color: #fff;
  font-size: .8rem;
  font-weight: bold;
  letter-spacing: .12em;
  padding: .3rem .7rem;
  border-radius: 6px;
  border: 2px solid #000;
  animation: blink 1.5s infinite;
  z-index: 10;
}
@keyframes blink {
  0%, 100% { opacity: 1 }
  50% { opacity: .35 }
}

/* 전체화면 토글 버튼 */
.btn-fullscreen {
  position: absolute;
  top: 1.5rem;
  right: 6.8rem;
  background: rgba(0, 0, 0, 0.65);
  color: #E8B84B;
  border: 2px solid #C9922A;
  font-size: .78rem;
  font-weight: bold;
  letter-spacing: .06em;
  padding: .3rem .75rem;
  border-radius: 6px;
  cursor: pointer;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-family: 'NeoDunggeunmo', sans-serif;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  transition: all 0.2s ease;
}
.btn-fullscreen:hover {
  background: #C9922A;
  color: #1A0F00;
  box-shadow: 0 0 14px rgba(201, 146, 42, 0.85);
  transform: translateY(-2px);
}

/* iOS iPhone Safari 등 Fullscreen API 미지원 모바일용 가상 전체화면 fallback */
body.pseudo-fullscreen {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 99999 !important;
  overflow: hidden !important;
}

/* ── 전체 화면 자동 스케일링 래퍼 (16:9 기준 1920x1080) ── */
.scale-wrapper {
  width: 1920px;
  height: 1080px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: center center;
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.5rem 2.5rem;
  box-sizing: border-box;
}

/* ── 전체 3컬럼 레이아웃 ── */
.main-layout {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 1.5rem;
  z-index: 2;
  position: relative;
}

/* 양옆 사이드 팀 컬럼 */
.side-column {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  width: 400px;
  flex-shrink: 0;
  gap: 1rem;
}

/* 중앙 영역 */
.center-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 0;
  position: relative;
}

/* ── 헤더 영역 ── */
.bc-header-wrap {
  text-align: center;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  z-index: 5;
}

/* 석양바보 타이틀 픽셀 로고 스타일 */
.bc-title {
  font-size: 2.8rem;
  color: #FFCC00;
  letter-spacing: .15em;
  font-weight: 900;
  -webkit-text-stroke: 2px #000000;
  text-shadow: 
    3px 3px 0px #000000,
    -1px -1px 0px #000,
    1px -1px 0px #000,
    -1px 1px 0px #000,
    1px 1px 0px #000;
  margin-top: 0.5rem;
}

/* 팀 패널 순서 뱃지 */
.turn-order-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: bold;
  padding: 0.18rem 0.55rem;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.04em;
  margin-bottom: 0.4rem;
  transition: all 0.3s;
}
.turn-order-badge.badge-1st {
  background: #FFCC00;
  border-color: #000;
  color: #000;
  font-size: 0.85rem;
  padding: 0.25rem 0.75rem;
  box-shadow: 0 0 12px rgba(255,204,0,0.5);
  animation: badge-pulse 1.8s ease-in-out infinite;
}
.turn-order-badge.badge-2nd {
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.4);
  color: rgba(255,255,255,0.8);
}
.turn-order-badge.badge-3rd {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.6);
}
@keyframes badge-pulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255,204,0,0.5); }
  50% { box-shadow: 0 0 22px rgba(255,204,0,0.85); }
}

/* ── 중앙 메인 보드 (공통슬롯) ── */
.board-center {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
  width: 100%;
  z-index: 4;
}

/* 공통 카드 슬롯 (대폭 확대) */
.common-card-slot {
  width: 340px;
  height: 240px;
  border: 4px dashed rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
  z-index: 5;
}
.slot-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.4);
  font-size: 1.1rem;
  font-weight: bold;
  gap: 0.6rem;
}

/* 정렬된 공통 카드 비주얼 */
.common-card {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: var(--cream);
  border: 4px solid #000;
  box-shadow: 0 8px 0 rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.5rem;
  overflow: hidden;
  animation: card-pop 0.35s cubic-bezier(.34,1.56,.64,1);
}
.common-card-emoji {
  font-size: 6.0rem;
  margin-bottom: 0.3rem;
  line-height: 1;
}
.common-card-name {
  font-size: 1.5rem;
  font-weight: bold;
  color: #1A0F00;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  text-align: center;
  padding: 0 4px;
}
.common-card.type-special {
  border-color: #000;
  background: #F4ECF7;
}
/* (turn-intro 제거됨) */

/* ── 양옆 팀별 패널 ── */
.team-panel {
  background: rgba(0, 0, 0, 0.6);
  border: 3px solid #000;
  border-radius: 14px;
  padding: 0.9rem 0.8rem 1.1rem;
  backdrop-filter: blur(4px);
  text-align: center;
  transition: all 0.25s;
  box-shadow: 0 6px 0 rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* .team-panel.active-turn 스타일은 JS에서 직접 적용 */
.team-name-title {
  font-size: 1.35rem;
  font-weight: bold;
  color: rgba(255, 255, 255, 0.8);
  margin-bottom: 0.8rem;
  letter-spacing: 0.08em;
  transition: color 0.3s;
}

.team-slots-container {
  display: flex;
  gap: 0.9rem;
  justify-content: center;
}

/* 크게 키운 미니 카드 슬롯 (175px x 245px) */
.mini-card-slot {
  width: 175px;
  height: 245px;
  border: 3.5px dashed rgba(255, 255, 255, 0.3);
  border-radius: 12px;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
}
.mini-card {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: var(--cream);
  border: 4px solid #000;
  box-shadow: 0 6px 0 rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.4rem;
  overflow: hidden;
  animation: card-pop 0.35s cubic-bezier(.34,1.56,.64,1);
}
.mini-card-emoji {
  font-size: 5.0rem;
  margin-bottom: 0.3rem;
  line-height: 1;
}
.mini-card-name {
  font-size: 1.3rem;
  font-weight: bold;
  color: #1A0F00;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  text-align: center;
  padding: 0 4px;
}
.mini-card.type-special {
  border-color: #000;
  background: #F4ECF7;
}
.mini-card.type-team {
  border-color: #000;
  background: #FDEDEC;
}
.mini-card.type-team.color-blue {
  border-color: #0A369D;
  background: #EAF2F8;
}
.mini-card.type-team.color-orange {
  border-color: #e67e22;
  background: #FEF9E7;
}

/* ── 중앙 드로우 하이라이트 오버레이 ── */
.draw-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.draw-overlay.show {
  display: flex;
  opacity: 1;
}

/* 날아와서 크게 3D 플립되는 하이라이트 카드 */
.draw-card {
  position: relative;
  width: 290px;
  height: 410px;
  perspective: 1200px;
  z-index: 205;
  transform-style: preserve-3d;
  opacity: 0;
  transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.7s ease;
}

.draw-card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.draw-card-inner.flipped {
  transform: rotateY(180deg);
}

.draw-card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 12px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.7);
}

.draw-card-back {
  background: url('images/card-back.jpg') no-repeat center center;
  background-size: cover;
  border: 5px solid #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}
.draw-card-back .db-emoji { font-size: 5.5rem; opacity: 0.25; }
.draw-card-back .db-text { font-size: 1.8rem; color: rgba(255,255,255,0.2); letter-spacing: 0.15em; }

.draw-card-front {
  background: var(--cream);
  border: 5px solid #000;
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.8rem 1.2rem;
  text-align: center;
  position: relative;
}
.draw-card-front .df-emoji { font-size: 6rem; line-height: 1; margin-bottom: 0.8rem; }
.draw-card-front .df-type {
  font-size: 0.85rem; font-weight: bold; border-radius: 4px; padding: 0.25rem 0.6rem;
  letter-spacing: 0.06em; margin-bottom: 0.6rem; display: inline-block;
  border: 2px solid #000;
}
.draw-card-front .df-name {
  font-size: 1.8rem; font-weight: 900;
  color: #1A0F00; margin-bottom: 0.7rem; line-height: 1.25;
}
.draw-card-front .df-desc { font-size: 1rem; color: #5C3D1E; line-height: 1.5; max-width: 220px; }
.draw-card-front .df-code {
  position: absolute; bottom: 12px; right: 14px;
  font-size: 0.7rem; color: rgba(0,0,0,0.3); font-weight: bold;
}

/* ── 슬롯 배치 비행 연출 클래스 ── */
.draw-card.fly-to-left {
  transform: translate(-600px, 200px) scale(0.12) rotate(-25deg) !important;
  opacity: 0 !important;
}
.draw-card.fly-to-right {
  transform: translate(600px, 200px) scale(0.12) rotate(25deg) !important;
  opacity: 0 !important;
}
.draw-card.fly-to-common {
  transform: translate(175px, 50px) scale(0.25) rotate(15deg) !important;
  opacity: 0 !important;
}

/* 연결 상태 표시 */
.conn-status {
  position: absolute;
  bottom: 1.5rem;
  right: 1.5rem;
  font-size: .65rem;
  color: rgba(255,255,255,.3);
  z-index: 10;
}


.card-img-fit {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: inherit;
}
.mini-card img {
  object-fit: cover;
}
.common-card img {
  object-fit: cover;
}

/* ── 특수 카드 15초 빨간색 타이머 UI ── */
.special-timer-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  margin-top: 1.2rem;
  background: rgba(20, 5, 5, 0.88);
  border: 3px solid #FF2A2A;
  border-radius: 12px;
  padding: 0.6rem 1.4rem;
  box-shadow: 0 0 25px rgba(255, 42, 42, 0.6), inset 0 0 10px rgba(255, 0, 0, 0.3);
  animation: timer-appear 0.3s ease-out;
  z-index: 100;
}
.special-timer-wrap.active {
  display: flex;
}
.special-timer-wrap.warning {
  animation: timer-warning 0.35s infinite alternate;
  border-color: #FF0000;
  box-shadow: 0 0 35px rgba(255, 0, 0, 0.95);
}
@keyframes timer-appear {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes timer-warning {
  from { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); }
  to { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 0, 0, 1); }
}

.timer-badge {
  font-size: 0.75rem;
  font-weight: bold;
  color: #FF6B6B;
  letter-spacing: 0.12em;
  margin-bottom: 0.2rem;
  text-shadow: 0 0 8px rgba(255, 42, 42, 0.8);
}
.timer-display {
  font-size: 2.8rem;
  font-weight: 900;
  color: #FF2A2A;
  font-family: 'NeoDunggeunmo', monospace;
  text-shadow: 
    0 0 10px rgba(255, 42, 42, 0.9),
    2px 2px 0px #000;
  line-height: 1;
  letter-spacing: 0.05em;
}
.timer-bar-bg {
  width: 200px;
  height: 10px;
  background: rgba(0, 0, 0, 0.6);
  border: 2px solid #FF2A2A;
  border-radius: 6px;
  margin-top: 0.4rem;
  overflow: hidden;
}
.timer-bar-fill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #FF7070, #FF0000);
  box-shadow: 0 0 10px #FF0000;
  transition: width 0.1s linear;
}

/* ── 파티클 이펙트 캔버스 ── */
.effect-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}

/* ── 폭발 / 성공 결과 팝업 오버레이 ── */
.result-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  animation: result-fade-in 0.3s ease-out forwards;
}
.result-overlay.active {
  display: flex;
}
.result-box {
  background: rgba(20, 10, 0, 0.92);
  border: 5px solid #FFCC00;
  border-radius: 20px;
  padding: 2rem 3rem;
  text-align: center;
  box-shadow: 0 0 50px rgba(255, 204, 0, 0.6);
  animation: result-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
}
.result-overlay.failed .result-box {
  border-color: #FF0000;
  background: rgba(25, 0, 0, 0.95);
  box-shadow: 0 0 60px rgba(255, 0, 0, 0.8);
}
.result-overlay.success .result-box {
  border-color: #2ECC71;
  background: rgba(0, 25, 10, 0.95);
  box-shadow: 0 0 60px rgba(46, 204, 113, 0.8);
}

.result-icon {
  font-size: 6rem;
  line-height: 1;
  animation: result-icon-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.result-title {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  color: #FFCC00;
  text-shadow: 3px 3px 0 #000;
}
.result-overlay.failed .result-title {
  color: #FF2A2A;
  text-shadow: 3px 3px 0 #000, 0 0 15px rgba(255,0,0,0.8);
}
.result-overlay.success .result-title {
  color: #2ECC71;
  text-shadow: 3px 3px 0 #000, 0 0 15px rgba(46,204,113,0.8);
}

.result-sub {
  font-size: 1.2rem;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 0.05em;
}

@keyframes result-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes result-pop {
  from { transform: scale(0.4) rotate(-10deg); }
  to { transform: scale(1) rotate(0deg); }
}
@keyframes result-icon-bounce {
  0% { transform: scale(0.2); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

</style>
</head>
<body>

<button class="btn-fullscreen" id="btn-fullscreen" onclick="toggleFullscreen()">⛶ 전체화면</button>
<div class="live-badge">● LIVE</div>
<div class="conn-status" id="conn-status">🟡 원격 연결 대기 중...</div>

<!-- 파티클 애니메이션 캔버스 -->
<canvas id="effect-canvas" class="effect-canvas"></canvas>

<!-- 결과 오버레이 (폭발 해골 / 성공 폭죽) -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box" id="result-box">
    <div class="result-icon" id="result-icon">💀</div>
    <div class="result-title" id="result-title">TIME OVER</div>
    <div class="result-sub" id="result-sub">제한시간 초과!</div>
  </div>
</div>

<!-- ── 자동 스케일링 래퍼 (1920x1080) ── -->
<div class="scale-wrapper" id="scale-wrapper">
  <!-- ── 메인 3컬럼 레이아웃 ── -->
  <div class="main-layout">
    <!-- 좌측 컬럼 (1~3팀 고정) -->
    <div class="side-column" id="left-teams">
      <!-- 1~3팀 보드가 동적 로드됩니다 -->
    </div>
    
    <!-- 중앙 컬럼 -->
    <div class="center-column">
      <div class="bc-header-wrap">
        <div class="bc-title">BABO TIME</div>
      </div>

<div class="conn-status" id="conn-status">운영 패널 연결 대기 중...</div>

<script>
let lastTs = 0;
let _lastRaw = '';
let activeCommonCardCode = '';

// 내부 렌더링 상태 캐싱 (비행 연출 시 렌더링 지연을 위함)
let renderedState = null;

// 이벤트 트래킹용 타임스탬프
let processedHighlightTs = 0;
let processedPlacementTs = 0;

// 팀 색상 & 이름 정의
const TEAM_CONFIG = {
  '1팀': { name: '그린',  color: '#27AE60' },
  '2팀': { name: '렌지',  color: '#E67E22' },
  '3팀': { name: '블루',  color: '#2980B9' },
  '4팀': { name: '옐로',  color: '#F1C40F' },
  '5팀': { name: '퍼플',  color: '#8E44AD' },
  '6팀': { name: '핑크',  color: '#E91E8C' },
};

/* ── 무설정 실시간 원격 수신기 (MQTT over WebSocket + PeerJS + LocalStorage) ── */
let currentRoomId = (new URLSearchParams(window.location.search)).get('room') || localStorage.getItem('babo_room_id') || 'babo-game-live-777';
let mqttClient = null;

function getMqttTopic() {
  return 'babogame/room/' + currentRoomId + '/state';
}

function updateConnStatus(msg, isSuccess = false) {
  const statusEl = document.getElementById('conn-status');
  if (statusEl) {
    statusEl.textContent = msg + ' (방: ' + currentRoomId + ')';
    statusEl.style.color = isSuccess ? 'rgba(46, 204, 113, 0.9)' : 'rgba(241, 196, 15, 0.7)';
  }
}

/* ── 1. MQTT 실시간 수신기 ── */
function initMqttReceiver() {
  if (mqttClient) {
    try { mqttClient.end(true); } catch(e) {}
  }
  updateConnStatus('🟡 MQTT 연결 중...');

  const brokers = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://test.mosquitto.org:8081',
    'wss://broker.hivemq.com:8884/mqtt'
  ];

  function connectBroker(idx) {
    if (typeof mqtt === 'undefined') return;
    const url = brokers[idx % brokers.length];
    const clientId = 'babo_disp_' + Math.random().toString(16).substring(2, 10);

    try {
      mqttClient = mqtt.connect(url, {
        clientId: clientId,
        clean: true,
        connectTimeout: 4000,
        reconnectPeriod: 3000
      });

      mqttClient.on('connect', () => {
        console.log('MQTT 연결 성공:', url);
        updateConnStatus('🟢 실시간 연동 완료', true);
        const topic = getMqttTopic();
        mqttClient.subscribe(topic, { qos: 1 }, (err) => {
          if (err) console.error('MQTT 구독 실패:', err);
          else console.log('MQTT 구독 성공:', topic);
        });
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data && data.ts && data.ts > lastTs) {
            lastTs = data.ts;
            handleMessage(data);
          }
        } catch(err) {
          console.error('MQTT 메시지 파싱 오류:', err);
        }
      });

      mqttClient.on('error', (err) => {
        console.warn('MQTT 오류:', err);
      });

      mqttClient.on('offline', () => {
        updateConnStatus('🟡 MQTT 재연결 중...');
      });
    } catch(e) {
      console.error('MQTT 초기화 실패:', e);
    }
  }

  connectBroker(0);
}

/* ── 2. PeerJS Direct 수신기 ── */
let peerDisplay = null;

function initPeerReceiver() {
  if (typeof Peer === 'undefined') return;
  try {
    peerDisplay = new Peer(currentRoomId);

    peerDisplay.on('open', (id) => {
      console.log('PeerJS 수신기 준비 완료:', id);
    });

    peerDisplay.on('connection', (conn) => {
      updateConnStatus('🟢 PeerJS 직접 연결됨', true);
      conn.on('data', (data) => {
        if (data && data.ts && data.ts > lastTs) {
          lastTs = data.ts;
          handleMessage(data);
        }
      });
    });

    peerDisplay.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        const fallbackPeer = new Peer(currentRoomId + '-sub-' + Math.floor(Math.random() * 1000));
        fallbackPeer.on('connection', (conn) => {
          conn.on('data', (data) => {
            if (data && data.ts && data.ts > lastTs) {
              lastTs = data.ts;
              handleMessage(data);
            }
          });
        });
      }
    });
  } catch (err) {
    console.error('PeerJS 수신기 오류:', err);
  }
}

setTimeout(() => {
  initMqttReceiver();
  initPeerReceiver();
}, 200);

/* ── 3. localStorage 및 폴링 감지 ── */
window.addEventListener('storage', e => {
  if (e.key !== 'babo_broadcast') return;
  try {
    const data = JSON.parse(e.newValue);
    if (!data || data.ts <= lastTs) return;
    lastTs = data.ts;
    handleMessage(data);
  } catch(err) {}
});

setInterval(() => {
  const raw = localStorage.getItem('babo_broadcast');
  if (!raw || raw === _lastRaw) return;
  _lastRaw = raw;
  try {
    const data = JSON.parse(raw);
    if (!data || data.ts <= lastTs) return;
    lastTs = data.ts;
    handleMessage(data);
  } catch(err) {}
}, 250);

/* ── 4. 2D 파티클 이펙트 엔진 (폭발 파티클 & 폭죽 커페티) ── */
let canvas, ctx;
let particles = [];
let animFrameId = null;

function initParticleCanvas() {
  canvas = document.getElementById('effect-canvas');
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  
  if (!animFrameId) {
    animFrameId = requestAnimationFrame(updateParticles);
  }
}

function updateParticles() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity || 0;
    p.rotation += p.vRot || 0;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);

    if (p.shape === 'rect') {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    } else if (p.shape === 'circle') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.shape === 'text') {
      ctx.font = `${p.size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, 0, 0);
    }
    ctx.restore();
  }

  animFrameId = requestAnimationFrame(updateParticles);
}

// 💥 "펑" 폭발 파티클 트리거 (시간초과/실패 시)
function triggerExplosion(originX, originY) {
  initParticleCanvas();
  const cx = originX || window.innerWidth / 2;
  const cy = originY || window.innerHeight / 2;

  const colors = ['#FF0000', '#FF4500', '#FF8C00', '#FFD700', '#330000', '#111111'];

  // 화염 파티클 & 파편 생성
  for (let i = 0; i < 180; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 22 + 4;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      gravity: 0.25,
      size: Math.random() * 18 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      decay: Math.random() * 0.02 + 0.015,
      rotation: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.3,
      shape: Math.random() > 0.4 ? 'circle' : 'rect'
    });
  }

  // 💥 픽셀 해골/폭발 텍스트 파티클
  const textEmojis = ['🔥', '💥', '💀', '💣'];
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 16 + 5;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      gravity: 0.15,
      size: Math.random() * 28 + 24,
      text: textEmojis[Math.floor(Math.random() * textEmojis.length)],
      alpha: 1,
      decay: Math.random() * 0.018 + 0.012,
      rotation: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.2,
      shape: 'text'
    });
  }
}

// 🎉 축하 폭죽(Confetti Fireworks) 파티클 트리거 (성공 시)
function triggerConfetti() {
  initParticleCanvas();
  const colors = ['#FF1493', '#00BFFF', '#32CD32', '#FFD700', '#FF4500', '#9400D3', '#FFFFFF'];

  // 상단 무작위 폭죽 발사점 3곳
  const launchPoints = [
    { x: window.innerWidth * 0.25, y: window.innerHeight * 0.4 },
    { x: window.innerWidth * 0.5, y: window.innerHeight * 0.3 },
    { x: window.innerWidth * 0.75, y: window.innerHeight * 0.4 }
  ];

  launchPoints.forEach(pt => {
    for (let i = 0; i < 90; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 18 + 6;
      particles.push({
        x: pt.x,
        y: pt.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        gravity: 0.18,
        size: Math.random() * 12 + 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: Math.random() * 0.012 + 0.008,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.4,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
  });

  const celebrationEmojis = ['🎉', '✨', '🏆', '⭐', '🎊'];
  for (let i = 0; i < 25; i++) {
    particles.push({
      x: window.innerWidth / 2 + (Math.random() - 0.5) * 400,
      y: window.innerHeight * 0.35,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 14 - 4,
      gravity: 0.1,
      size: Math.random() * 26 + 26,
      text: celebrationEmojis[Math.floor(Math.random() * celebrationEmojis.length)],
      alpha: 1,
      decay: 0.01,
      rotation: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.2,

    });

}

// ── 결과 팝업 표시 (실패: 해골 / 성공: 폭죽) ──
function showResultOverlay(type) {
  const overlay = document.getElementById('result-overlay');
  const icon = document.getElementById('result-icon');
  const title = document.getElementById('result-title');
  const sub = document.getElementById('result-sub');
  if (!overlay) return;

  if (type === 'failed') {
    overlay.className = 'result-overlay failed active';
    icon.textContent = '💀';
    title.textContent = 'TIME OVER!';
    sub.textContent = '제한시간이 도과되었습니다! (15초 초과)';
    triggerExplosion();
  } else if (type === 'success') {
    overlay.className = 'result-overlay success active';
    icon.textContent = '🎉';
    title.textContent = 'SUCCESS!';
    sub.textContent = '특수 미션 성공!';
    triggerConfetti();
  }

  // 3.5초 후 팝업 자동으로 닫힘
  setTimeout(() => {
    overlay.classList.remove('active');
  }, 3500);
}

/* ── 5. 특수 카드 15초 타이머 로직 ── */
let specialTimerInterval = null;
let specialTimerRemaining = 15.0;
let isSpecialTimerRunning = false;

function updateSpecialTimerUI() {
  const timerWrap = document.getElementById('special-timer-wrap');
  const display = document.getElementById('timer-display');
  const fill = document.getElementById('timer-bar-fill');
  if (!timerWrap || !display || !fill) return;

  const displayTime = Math.max(0, specialTimerRemaining).toFixed(1);
  display.textContent = displayTime;

  const percent = Math.max(0, Math.min(100, (specialTimerRemaining / 15.0) * 100));
  fill.style.width = percent + '%';

  if (specialTimerRemaining <= 3.0 && specialTimerRemaining > 0) {
    timerWrap.classList.add('warning');
  } else {
    timerWrap.classList.remove('warning');
  }
}

function prepareSpecialTimer() {
  stopSpecialTimer();

  const timerWrap = document.getElementById('special-timer-wrap');
  if (timerWrap) timerWrap.classList.add('active');

  specialTimerRemaining = 15.0;
  isSpecialTimerRunning = false; // 카드가 처음 뽑혔을 때는 15.0s 대기 상태!
  updateSpecialTimerUI();

  specialTimerInterval = setInterval(() => {
    if (!isSpecialTimerRunning) return;

    specialTimerRemaining -= 0.1;
    updateSpecialTimerUI();

    if (specialTimerRemaining <= 0.001) {
      specialTimerRemaining = 0;
      updateSpecialTimerUI();
      stopSpecialTimer();
      showResultOverlay('failed');
    }
  }, 100);
}

function startSpecialTimer() {
  prepareSpecialTimer();
}

function pauseSpecialTimer() {
  isSpecialTimerRunning = false;
  const timerWrap = document.getElementById('special-timer-wrap');
  if (timerWrap) timerWrap.classList.remove('warning');
}

function resumeSpecialTimer() {
  if (specialTimerRemaining > 0) {
    isSpecialTimerRunning = true; // 운영진이 시작/재개를 클릭했을 때부터 카운트다운 감소 시작!
  }
}

function stopSpecialTimer() {
  if (specialTimerInterval) {
    clearInterval(specialTimerInterval);
    specialTimerInterval = null;
  }
  isSpecialTimerRunning = false;

  const timerWrap = document.getElementById('special-timer-wrap');
  if (timerWrap) {
    timerWrap.classList.remove('active');
    timerWrap.classList.remove('warning');
  }
}

function triggerTimerSuccess() {
  stopSpecialTimer();
  showResultOverlay('success');
}

let lastProcessedTimerActionTs = 0;

function handleMessage(data) {
  updateConnStatus('🟢 실시간 연동 완료', true);
  if (data.type === 'sync_state' && data.state) {
    syncGameState(data.state);
  }
}

// 통합 동기화 처리
function syncGameState(state) {

  // 초기화/리셋으로 인해 하이라이트가 취소 또는 사라진 경우 방어 로직
  if (!state.highlightCard) {
    processedHighlightTs = 0;
    stopSpecialTimer();
  }
  if (!state.lastPlaced) {
    processedPlacementTs = 0;
  }

  // 1. 드로우 하이라이트 연출 처리
  if (state.highlightCard && state.highlightCard.ts > processedHighlightTs) {
    processedHighlightTs = state.highlightCard.ts;
    triggerDrawAnimation(state.highlightCard.card);
  }

  // 2. 운영자 패널의 특수 타이머 수동 액션 감지 (pause / resume / success / fail)
  if (state.specialTimerAction && state.specialTimerAction.ts > lastProcessedTimerActionTs) {
    lastProcessedTimerActionTs = state.specialTimerAction.ts;
    const act = state.specialTimerAction.action;
    if (act === 'pause') pauseSpecialTimer();
    else if (act === 'resume') resumeSpecialTimer();
    else if (act === 'success') triggerTimerSuccess();
    else if (act === 'fail') {
      stopSpecialTimer();
      showResultOverlay('failed');
    }
  }

  // 3. 슬롯 배치 연출 (lastPlaced) 처리
  if (state.lastPlaced && state.lastPlaced.ts > processedPlacementTs) {
    processedPlacementTs = state.lastPlaced.ts;
    stopSpecialTimer(); // 슬롯 배치 후에는 타이머 자동 종료
    triggerPlacementAnimation(state.lastPlaced, state);
  } else {
    // 하이라이트 중인 카드가 없을 때(즉 리셋되거나 취소되었을 때)만 오버레이를 닫아줍니다!
    if (!state.highlightCard) {
      const overlay = document.getElementById('draw-overlay');
      overlay.style.display = 'none';
      overlay.classList.remove('show');
      
      const inner = document.getElementById('draw-card-inner');
      if (inner) inner.classList.remove('flipped');
      
      const drawCard = document.getElementById('draw-card');
      if (drawCard) drawCard.className = 'draw-card';

      stopSpecialTimer();
      renderBoardGrid(state);
    } else {
      renderBoardGrid(state);
    }
  }
}

// ── 카드 덱에서 카드가 뽑히는 3D 드로우 애니메이션 ──
function triggerDrawAnimation(card) {
  const overlay = document.getElementById('draw-overlay');
  const drawCard = document.getElementById('draw-card');
  const inner = document.getElementById('draw-card-inner');

  // 데이터 바인딩
  const dfImage = document.getElementById('df-image');
  const dfEmoji = document.getElementById('df-emoji');
  const dfType = document.getElementById('df-type');
  const dfName = document.getElementById('df-name');
  const dfDesc = document.getElementById('df-desc');
  const dfCode = document.getElementById('df-code');
  const front = document.querySelector('.draw-card-front');

  if (card.image) {
    dfImage.src = card.image;
    dfImage.style.display = 'block';

    dfEmoji.style.display = 'none';
    dfType.style.display = 'none';
    dfName.style.display = 'none';
    dfDesc.style.display = 'none';
    dfCode.style.display = 'none';

    front.style.padding = '0';

    // 카드 보더 테마색 분기 처리
    if (card.type === 'team') {
      if (card.color === 'blue') {
        front.style.border = '10px solid #0A369D';
      } else if (card.color === 'orange') {
        front.style.border = '10px solid #e67e22';
      } else {
        front.style.border = '5px solid #000';
      }
    } else {
      front.style.border = '5px solid #000';
    }
  } else {
    dfImage.style.display = 'none';

    dfEmoji.style.display = '';
    dfType.style.display = '';
    dfName.style.display = '';
    dfDesc.style.display = '';
    dfCode.style.display = '';

    front.style.padding = '';

    dfEmoji.textContent = card.emoji;
    dfName.textContent = card.name;
    dfDesc.textContent = card.desc;
    dfCode.textContent = card.code;
    dfType.textContent = TYPE_META[card.type].label;
    dfType.className = `df-type type-${card.type}`;
  }

  // 모션 초기화
  drawCard.className = 'draw-card';
  inner.classList.remove('flipped');
  overlay.className = 'draw-overlay';
  overlay.style.display = 'flex';

  // 카드 시작 위치 계산 (공통 슬롯 위치 기준)
  const deck = document.querySelector('.common-card-slot') || document.querySelector('.board-center');
  const deckRect = deck.getBoundingClientRect();
  const overlayRect = overlay.getBoundingClientRect();

  // 덱의 절대좌표 기준 오버레이 중앙과의 거리 계산
  const startX = deckRect.left + deckRect.width/2 - (overlayRect.left + overlayRect.width/2);
  const startY = deckRect.top + deckRect.height/2 - (overlayRect.top + overlayRect.height/2);

  // 카드를 최초에 덱 뭉치 위치로 설정
  drawCard.style.transition = 'none';
  drawCard.style.transform = `translate(${startX}px, ${startY}px) scale(0.35) rotate(-15deg)`;
  drawCard.style.opacity = '0';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // 오버레이 암전
      overlay.classList.add('show');
      
      // 트랜지션 활성화 후 중앙으로 날아옴
      drawCard.style.transition = 'transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.7s ease';
      drawCard.style.transform = 'translate(0, 0) scale(1) rotate(0deg)';
      drawCard.style.opacity = '1';

      // 중앙에 안착할 무렵 3D 앞면으로 플립
      setTimeout(() => {
        inner.classList.add('flipped');

        // 🔥 특수 카드일 경우 15초 타이머 시작!
        if (card.type === 'special') {
          startSpecialTimer();
        } else {
          stopSpecialTimer();
        }
      }, 550);
    });
  });
}

// ── 슬롯 배치에 따른 비행 소멸(Fly-to-slot) 애니메이션 ──
function triggerPlacementAnimation(placement, state) {
  stopSpecialTimer(); // 슬롯 배치 애니메이션 시작 시 타이머 정지 및 은닉

  const overlay = document.getElementById('draw-overlay');
  const drawCard = document.getElementById('draw-card');

  if (overlay.classList.contains('show')) {
    const target = placement.target;
    
    // 배치 대상의 방향 감지
    let flyClass = 'fly-to-common';
    if (target === 'common') {
      flyClass = 'fly-to-common';
    } else {
      const isLeftColumn = ['1팀', '2팀', '3팀'].includes(target);
      flyClass = isLeftColumn ? 'fly-to-left' : 'fly-to-right';
    }

    // 카드 비행 트랜지션 시작
    drawCard.classList.add(flyClass);
    
    // 오버레이 암전 제거
    overlay.style.transition = 'opacity 0.6s ease';
    overlay.classList.remove('show');

    // 비행 완료 시점에 오버레이 끄고 그리드에 팝하며 안착시킴
    setTimeout(() => {
      overlay.style.display = 'none';
      drawCard.className = 'draw-card';
      renderBoardGrid(state, placement); // 배치 타겟 팝 애니메이션 트리거
    }, 600);
  } else {
    renderBoardGrid(state);
  }
}

// ── 전체 3컬럼 보드판 그리드 렌더링 ──
function renderBoardGrid(state, popTarget = null) {
  renderedState = state;
  
  // 1. 공통 카드 렌더링
  const commonSlot = document.getElementById('common-slot-wrap');
  if (state.commonCard) {
    activeCommonCardCode = state.commonCard.code;
    const shouldPop = popTarget && popTarget.target === 'common';
    
    const content = state.commonCard.image
      ? `<img src="${state.commonCard.image}" class="card-img-fit" />`
      : `<div class="common-card-emoji">${state.commonCard.emoji}</div>
         <div class="common-card-name">${state.commonCard.name}</div>`;
         
    const paddingStyle = state.commonCard.image ? 'padding:0;' : '';
    
    commonSlot.innerHTML = `
      <div class="common-card type-${state.commonCard.type}" style="${paddingStyle} ${shouldPop ? 'animation: card-pop 0.45s cubic-bezier(.34,1.8,.64,1);' : ''}">
        ${content}
      </div>
    `;
  } else {
    activeCommonCardCode = '';
    commonSlot.innerHTML = `
      <div class="slot-empty">
        <div style="font-size:3.2rem; opacity:0.3;">📢</div>
        <div style="text-align:center; font-size:1.0rem; letter-spacing:0.04em;">공통 규칙<br>카드 슬롯</div>
      </div>
    `;
  }

  // 2. 좌우 3팀씩 분할하여 렌더링 (1~3팀 및 4~6팀 자리 고정)
  const leftTeamsContainer = document.getElementById('left-teams');
  const rightTeamsContainer = document.getElementById('right-teams');
  
  leftTeamsContainer.innerHTML = '';
  rightTeamsContainer.innerHTML = '';

  const currentActiveTeam = state.turnOrder && state.turnOrder[0] ? state.turnOrder[0] : '';

  // 좌측 컬럼 (1팀 ~ 3팀 고정 배치)
  ['1팀', '2팀', '3팀'].forEach(team => {
    const isCurrentTurn = (team === currentActiveTeam);
    const displayName = (state.teamNames && state.teamNames[team]) || team;
    const teamColor = TEAM_CONFIG[team] ? TEAM_CONFIG[team].color : '#FFCC00';
    
    const teamPanel = document.createElement('div');
    teamPanel.className = 'team-panel';
    teamPanel.style.borderColor = isCurrentTurn ? teamColor : 'rgba(0,0,0,0.5)';
    teamPanel.style.boxShadow = isCurrentTurn
      ? `0 0 18px ${teamColor}66, 0 6px 0 rgba(0,0,0,0.3)`
      : '0 6px 0 rgba(0,0,0,0.3)';
    if (isCurrentTurn) {
      teamPanel.style.background = 'rgba(43, 24, 9, 0.7)';
      teamPanel.style.transform = 'translateY(-2px)';
    }
    
    const title = document.createElement('div');
    title.className = 'team-name-title';
    title.style.color = isCurrentTurn ? teamColor : 'rgba(255,255,255,0.8)';
    if (isCurrentTurn) title.style.textShadow = '1px 1px 0 #000';
    title.textContent = displayName;
    teamPanel.appendChild(title);
    
    const slotsContainer = document.createElement('div');
    slotsContainer.className = 'team-slots-container';
    
    for (let i = 0; i < 2; i++) {
      const card = state.teamSlots[team][i];
      const slot = document.createElement('div');
      slot.className = 'mini-card-slot';
      
      if (card) {
        const shouldPop = popTarget && popTarget.target === team && popTarget.slotIdx === i;
        
        const miniCard = document.createElement('div');
        miniCard.className = `mini-card type-${card.type}` + (card.color ? ` color-${card.color}` : '');
        if (shouldPop) {
          miniCard.style.animation = 'card-pop 0.45s cubic-bezier(.34,1.8,.64,1)';
        }
        
        if (card.image) {
          miniCard.style.padding = '0';
          miniCard.innerHTML = `<img src="${card.image}" class="card-img-fit" />`;
        } else {
          miniCard.innerHTML = `
            <div class="mini-card-emoji">${card.emoji}</div>
            <div class="mini-card-name">${card.name}</div>
          `;
        }
        slot.appendChild(miniCard);
      }
      slotsContainer.appendChild(slot);
    }
    
    teamPanel.appendChild(slotsContainer);
    leftTeamsContainer.appendChild(teamPanel);
  });

  // 우측 컬럼 (4팀 ~ 6팀 고정 배치)
  ['4팀', '5팀', '6팀'].forEach(team => {
    const isCurrentTurn = (team === currentActiveTeam);
    const displayName = (state.teamNames && state.teamNames[team]) || team;
    const teamColor = TEAM_CONFIG[team] ? TEAM_CONFIG[team].color : '#FFCC00';
    
    const teamPanel = document.createElement('div');
    teamPanel.className = 'team-panel';
    teamPanel.style.borderColor = isCurrentTurn ? teamColor : 'rgba(0,0,0,0.5)';
    teamPanel.style.boxShadow = isCurrentTurn
      ? `0 0 18px ${teamColor}66, 0 6px 0 rgba(0,0,0,0.3)`
      : '0 6px 0 rgba(0,0,0,0.3)';
    if (isCurrentTurn) {
      teamPanel.style.background = 'rgba(43, 24, 9, 0.7)';
      teamPanel.style.transform = 'translateY(-2px)';
    }
    
    const title = document.createElement('div');
    title.className = 'team-name-title';
    title.style.color = isCurrentTurn ? teamColor : 'rgba(255,255,255,0.8)';
    if (isCurrentTurn) title.style.textShadow = '1px 1px 0 #000';
    title.textContent = displayName;
    teamPanel.appendChild(title);
    
    const slotsContainer = document.createElement('div');
    slotsContainer.className = 'team-slots-container';
    
    for (let i = 0; i < 2; i++) {
      const card = state.teamSlots[team][i];
      const slot = document.createElement('div');
      slot.className = 'mini-card-slot';
      
      if (card) {
        const shouldPop = popTarget && popTarget.target === team && popTarget.slotIdx === i;
        
        const miniCard = document.createElement('div');
        miniCard.className = `mini-card type-${card.type}` + (card.color ? ` color-${card.color}` : '');
        if (shouldPop) {
          miniCard.style.animation = 'card-pop 0.45s cubic-bezier(.34,1.8,.64,1)';
        }
        
        if (card.image) {
          miniCard.style.padding = '0';
          miniCard.innerHTML = `<img src="${card.image}" class="card-img-fit" />`;
        } else {
          miniCard.innerHTML = `
            <div class="mini-card-emoji">${card.emoji}</div>
            <div class="mini-card-name">${card.name}</div>
          `;
        }
        slot.appendChild(miniCard);
      }
      slotsContainer.appendChild(slot);
    }
    
    teamPanel.appendChild(slotsContainer);
    rightTeamsContainer.appendChild(teamPanel);
  });
}

// 최초 로드 시 기존 상태 로드
async function initBroadcast() {
  await loadDynamicCards();
  const initRaw = localStorage.getItem('babo_broadcast');
  if (initRaw) {
    try {
      const data = JSON.parse(initRaw);
      if (data && data.type === 'sync_state' && data.state) {
        syncGameState(data.state);
      }
    } catch(e) {}
  }
}
initBroadcast();

// ── 전체화면 (Fullscreen) 토글 기능 (PC/Android/iOS 모바일 하이브리드 지원) ──
function toggleFullscreen() {
  const docEl = document.documentElement;
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.body.classList.contains('pseudo-fullscreen'));

  if (!isFs) {
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => enablePseudoFullscreen());
    } else if (docEl.webkitRequestFullscreen) {
      try { docEl.webkitRequestFullscreen(); } catch(e) { enablePseudoFullscreen(); }
    } else if (docEl.msRequestFullscreen) {
      try { docEl.msRequestFullscreen(); } catch(e) { enablePseudoFullscreen(); }
    } else {
      enablePseudoFullscreen();
    }
  } else {
    if (document.body.classList.contains('pseudo-fullscreen')) {
      disablePseudoFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => disablePseudoFullscreen());
    } else if (document.webkitExitFullscreen) {
      try { document.webkitExitFullscreen(); } catch(e) { disablePseudoFullscreen(); }
    } else if (document.msExitFullscreen) {
      try { document.msExitFullscreen(); } catch(e) { disablePseudoFullscreen(); }
    } else {
      disablePseudoFullscreen();
    }
  }
}

function enablePseudoFullscreen() {
  document.body.classList.add('pseudo-fullscreen');
  window.scrollTo(0, 1);
  updateFullscreenBtn();
}

function disablePseudoFullscreen() {
  document.body.classList.remove('pseudo-fullscreen');
  updateFullscreenBtn();
}

function updateFullscreenBtn() {
  const btn = document.getElementById('btn-fullscreen');
  if (!btn) return;
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.body.classList.contains('pseudo-fullscreen'));
  btn.innerHTML = isFs ? '🗗 창모드' : '⛶ 전체화면';
}

document.addEventListener('fullscreenchange', () => { updateFullscreenBtn(); autoScale(); });
document.addEventListener('webkitfullscreenchange', () => { updateFullscreenBtn(); autoScale(); });
document.addEventListener('msfullscreenchange', () => { updateFullscreenBtn(); autoScale(); });

// ── 해상도/전자기기별 화면 잘림 방지 Auto Scaling ──
function autoScale() {
  const wrapper = document.getElementById('scale-wrapper');
  if (!wrapper) return;

  const baseWidth = 1920;
  const baseHeight = 1080;

  // Visual Viewport 지원 시 더 정확한 디스플레이 크기 계산
  const windowWidth = (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth;
  const windowHeight = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;

  const scaleX = windowWidth / baseWidth;
  const scaleY = windowHeight / baseHeight;

  // 잘림 없이 전체 화면에 핏되도록 축소/확대 비율 계산
  const scale = Math.min(scaleX, scaleY);

  wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', autoScale);
window.addEventListener('orientationchange', autoScale);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', autoScale);
  window.visualViewport.addEventListener('scroll', autoScale);
}
document.addEventListener('DOMContentLoaded', autoScale);
window.addEventListener('load', autoScale);
autoScale();
</script>
